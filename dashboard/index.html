/* One drawer. The open flag is read from and written back to FSTATE, so a
   re-render restores what the user had open instead of resetting it. `inert`
   keeps the collapsed contents out of the tab order; without it a closed
   drawer still catches keyboard focus and scrolls itself into view. */
/* The selection marker. Measured from the live boxes rather than computed from
   index and width, so it stays correct when the track wraps to two rows on a
   narrow screen and when the labels are different lengths. */
let VIEW_HOST = null;

function moveThumb(host, btn, animate = true){
  const thumb = host && host.querySelector(".thumb");
  if(!thumb || !btn) return;
  const h = host.getBoundingClientRect(), b = btn.getBoundingClientRect();
  if(!b.width) return;                       // not laid out yet, a later call will place it
  if(!animate) thumb.style.transition = "none";
  thumb.hidden = false;
  thumb.style.width = b.width + "px";
  thumb.style.height = b.height + "px";
  thumb.style.transform = `translate(${b.left - h.left}px, ${b.top - h.top}px)`;
  if(!animate) requestAnimationFrame(() => { thumb.style.transition = ""; });
}

/* Registered once. A wrap or a font swap changes where the buttons are, and a
   marker left at the old coordinates would sit under the wrong label. */
window.addEventListener("resize", () => {
  if(!VIEW_HOST || !document.body.contains(VIEW_HOST)) return;
  moveThumb(VIEW_HOST, VIEW_HOST.querySelector('[aria-pressed="true"]'), false);
});

function wireDrawer(btn, drawer, key){
  const inner = drawer.firstElementChild;
  const apply = () => {
    const on = FSTATE.open[key];
    btn.setAttribute("aria-expanded", String(on));
    drawer.toggleAttribute("data-open", on);
    if("inert" in HTMLElement.prototype) inner.inert = !on;
    else inner.setAttribute("aria-hidden", String(!on));
  };
  btn.addEventListener("click", () => { FSTATE.open[key] = !FSTATE.open[key]; apply(); });
  apply();
}

/* The approved presets. Each is a combination verified to return a meaningful
   population and to be materially different from its closest single filter. They
   populate the panel rather than bypassing it, so the user can see what was applied. */
let PRESET_BY_KEY = {};                 // for the active bar, which lives outside the drawer

async function paintPresets(host){
  let d;
  try { d = await API.presets(); } catch(e){ return; }
  PRESET_BY_KEY = Object.fromEntries(d.presets.map(p => [p.key, p]));
  host.innerHTML = "";
  d.presets.forEach(p => {
    const on = (FSTATE.fromPreset || FSTATE.preset) === p.key;
    const b = el(`<button class="pchip" aria-pressed="${on}"
      title="${esc(p.note)}">${esc(p.label)}<span class="n">${nf(p.count)}</span></button>`);
    b.addEventListener("click", () => {
      const already = (FSTATE.fromPreset || FSTATE.preset) === p.key;
      if(already){ removePreset(); }
      else { applyPreset(p); }
      [...host.children].forEach(x => x.setAttribute("aria-pressed", "false"));
      if(!already) b.setAttribute("aria-pressed", "true");
      refresh();
    });
    host.append(b);
  });
  paintActivePreset();
}

/* Loading a preset REPLACES the panel rather than stacking on it, so the count on the chip
   is the count you get. What was in the panel first is kept, and put back if the preset is
   removed. */
function applyPreset(p){
  FSTATE.beforePreset = {...FSTATE.values};
  FSTATE.shown = 25;
  FSTATE.lastApplied = {key: "preset", label: p.label};
  if(p.adjustable){
    // Into the controls, where it can be read and changed.
    FSTATE.values = JSON.parse(JSON.stringify(p.filters));
    FSTATE.fromPreset = p.key;
    FSTATE.preset = null;
  } else {
    // Stays a server-side clause: see `not_adjustable` on the preset.
    FSTATE.values = {};
    FSTATE.preset = p.key;
    FSTATE.fromPreset = null;
  }
}

function removePreset(){
  FSTATE.values = FSTATE.beforePreset ? {...FSTATE.beforePreset} : {};
  FSTATE.beforePreset = null;
  FSTATE.preset = null;
  FSTATE.fromPreset = null;
  FSTATE.lastApplied = null;
  FSTATE.shown = 25;
}

/* The selected preset, restated outside the drawer with its own count and the
   plain-English note the API already carries. Closing the drawer then hides a
   control, never a fact. */
function paintActivePreset(){
  const host = document.getElementById("activepreset");
  if(!host) return;
  host.innerHTML = "";
  const p = activePreset();
  if(!p) return;

  const pristine = isPristinePreset(p);
  /* The conditions, named by the controls that hold them. For an adjustable preset these
     are the live panel values, so the list stays true after an edit rather than describing
     what the preset used to be. */
  const chips = p.adjustable
    ? describeValues(FSTATE.values).map(b =>
        `<span class="matchchip"><span>${esc(b.label)}</span>${esc(b.value)}</span>`).join("")
    /* No controls to read these off, so they are the preset's own words and are marked
       as fixed rather than dressed up to look editable. */
    : (p.conditions || []).map(t =>
        `<span class="matchchip fixed">${esc(t)}</span>`).join("");

  const bar = el(`
    <div class="activepreset${pristine ? "" : " adjusted"}">
      <div class="ap-body">
        <div class="ap-top">${esc(p.label)}
          ${pristine ? `<span class="n">${nf(p.count)} companies</span>`
                     : `<span class="ap-tag">adjusted</span>`}</div>
        <p class="ap-note">${esc(p.note)}</p>
        ${chips ? `<div class="ap-conds">${chips}</div>` : ""}
        ${p.adjustable
          ? `<p class="ap-hint">${pristine
              ? "Open Advanced filters to loosen or change any of these."
              : "Changed from the preset. The count above the results is what your version returns; "
                + "the preset on its own returns " + nf(p.count) + "."}</p>`
          : `<p class="ap-hint">This one also requires: <b>${esc(p.not_adjustable || "")}</b>,
             which has no filter control, so this preset cannot be taken apart here.</p>`}
      </div>
      <button>${pristine ? "Remove" : "Reset"}</button>
    </div>`);

  const btn = bar.querySelector("button");
  btn.addEventListener("click", () => {
    /* Reset puts the preset back as approved; Remove takes it off and restores whatever
       the panel held beforehand. */
    if(!pristine && p.adjustable){
      FSTATE.values = JSON.parse(JSON.stringify(p.filters));
      FSTATE.shown = 25;
    } else {
      removePreset();
      syncPresetChips();
    }
    refresh();
  });
  host.append(bar);
}

/* One call site for "something changed": repaint the panel, because every option's
   count moves with every other selection, then repaint the results. */
async function refresh(){
  const body = document.getElementById("fbody");
  const rows = document.getElementById("wlrows");
  if(!body || !rows) return;
  paintToolBadges();
  paintActivePreset();
  paintPanel(body);
  await paintRows(rows);
}

/* What is switched on, said on the closed button. A drawer may hide a control;
   it may not hide the fact that the control is doing something. */
function paintToolBadges(){
  const set = (id, text) => {
    const host = document.getElementById(id);
    const badge = host && host.querySelector("[data-badge]");
    if(!badge) return;
    badge.textContent = text;
    badge.hidden = !text;
  };
  const p = activePreset();
  set("btn-presets", p ? (isPristinePreset(p) ? "1 selected" : "1 adjusted") : "");
  const n = activeCount();
  set("btn-filters", n ? `${n} active` : "");
}

/* ---------------------------------------------------------------------------
   "Why this company matched".

   A company opened from the list arrived because of a view, a preset or a set of
   filters, and that context was being dropped at the door: the profile looked
   identical whether it came from a five-filter stack or from the search box. This
   carries the query across, in the same words the panel used, so the reader knows
   what they were looking at when they clicked. Set only when opening from a result
   row; a search hit has no query behind it and shows nothing.
--------------------------------------------------------------------------- */
let FILTER_META = [];
let MATCH_CONTEXT = null;

const VIEW_LABEL = {all: "All companies", gazette: "Gazette signal", lbg: "Former LBG client"};

/* One reader for "what is switched on", used by the preset bar, the company page and the
   adjusted/pristine comparison. It reads the live filter metadata, so a condition is
   always described in the same words the control itself uses. */
function describeValues(values){
  const bits = [];
  for(const f of FILTER_META){
    if(f.kind === "range"){
      const lo = values[f.key + "_min"], hi = values[f.key + "_max"];
      if(isBlank(lo) && isBlank(hi)) continue;
      const range = !isBlank(lo) && !isBlank(hi) ? `${lo} to ${hi}`
                  : !isBlank(lo) ? `${lo} or more` : `${hi} or less`;
      bits.push({key: f.key, label: f.label, value: range});
      continue;
    }
    const v = values[f.key];
    if(isBlank(v)) continue;
    const chosen = Array.isArray(v) ? v : [v];
    const named = chosen.map(x => {
      const o = (f.options || []).find(o => o.value === x);
      return o ? o.label : x;
    });
    bits.push({key: f.key, label: f.label, value: named.join(", ")});
  }
  return bits;
}

const isBlank = v => v === undefined || v === null || v === ""
                  || (Array.isArray(v) && !v.length);

function describeMatch(){
  const bits = describeValues(FSTATE.values);
  const preset = activePreset();
  if(!bits.length && !preset && FSTATE.view === "all") return null;
  return {view: FSTATE.view, preset: preset || null, filters: bits,
          adjusted: preset ? !isPristinePreset(preset) : false};
}

function matchPanel(){
  const m = MATCH_CONTEXT;
  if(!m) return null;
  const chips = m.filters.map(b =>
    `<span class="matchchip"><span>${esc(b.label)}</span>${esc(b.value)}</span>`).join("");
  return el(`
    <section class="matchbar rise">
      <div class="phead"><span class="ma-ico">${maIcon("target")}</span>
        <p class="eyebrow">Why this company is in your list</p></div>
      <div class="matchrow">
        <span class="matchchip view"><span>View</span>${esc(VIEW_LABEL[m.view] || m.view)}</span>
        ${m.preset ? `<span class="matchchip preset"><span>Preset</span>${esc(m.preset.label)}</span>` : ""}
        ${chips}
      </div>
      ${m.preset ? `<p class="matchnote">${esc(m.preset.note)}</p>` : ""}
    </section>`);
}

/* ---------------------------------------------------------------------------
   The filter panel.

   Rendered from /api/filters, which returns groups, labels and each option's live
   count. Counts are computed with every other active filter applied but not the
   facet's own, so a multi-select does not zero out its own unselected options.
--------------------------------------------------------------------------- */
const GROUP_ORDER = ["Core", "Borrowing", "Lender", "Filing", "Momentum", "Signals"];
const OPEN_BY_DEFAULT = new Set(["Core"]);

function optLabel(o){
  const n = o.count === 0 ? "0" : nf(o.count);
  return `${o.label} (${n})`;
}

function filterControl(f){
  const val = FSTATE.values[f.key];
  const wrap = el(`<div class="fitem"><label for="f-${f.key}">${esc(f.label)}</label></div>`);

  if(f.kind === "range"){
    const [lo, hi] = [FSTATE.values[f.key + "_min"] ?? "", FSTATE.values[f.key + "_max"] ?? ""];
    const box = el(`<div class="pair">
      <input id="f-${f.key}" type="number" placeholder="min" value="${lo}">
      <input type="number" placeholder="max" value="${hi}"></div>`);
    const [a, b] = box.querySelectorAll("input");
    a.addEventListener("change", () => setFilter(f.key + "_min", a.value, f.label));
    b.addEventListener("change", () => setFilter(f.key + "_max", b.value, f.label));
    wrap.append(box);
    return wrap;
  }

  if(f.kind === "search"){
    const inp = el(`<input id="f-${f.key}" type="search" placeholder="type to search"
      value="${Array.isArray(val) ? esc(val.join(", ")) : ""}">`);
    const list = el(`<select multiple size="4" style="margin-top:6px"></select>`);
    let seq = 0;
    const load = async term => {
      const my = ++seq;
      const d = await API.options(f.key, term, fparams());
      if(my !== seq) return;
      list.innerHTML = "";
      d.options.forEach(o => {
        const s = el(`<option value="${esc(o.value)}">${esc(optLabel(o))}</option>`);
        if(Array.isArray(val) && val.includes(o.value)) s.selected = true;
        list.append(s);
      });
    };
    inp.addEventListener("input", () => load(inp.value));
    list.addEventListener("change", () =>
      setFilter(f.key, [...list.selectedOptions].map(o => o.value), f.label));
    load("");
    wrap.append(inp, list);
    return wrap;
  }

  const multi = ["in", "in_expr"].includes(f.kind) || f.key === "gazette";
  const sel = el(`<select id="f-${f.key}" ${multi ? "multiple" : ""}></select>`);
  if(!multi) sel.append(el(`<option value="">Any</option>`));
  f.options.forEach(o => {
    const opt = el(`<option value="${esc(o.value)}" ${o.count === 0 ? 'class="zero"' : ""}>
      ${esc(optLabel(o))}</option>`);
    const cur = Array.isArray(val) ? val : (val == null ? [] : [val]);
    if(cur.includes(o.value)) opt.selected = true;
    sel.append(opt);
  });
  sel.addEventListener("change", () => setFilter(
    f.key, multi ? [...sel.selectedOptions].map(o => o.value) : sel.value, f.label));
  wrap.append(sel);
  return wrap;
}

function setFilter(key, value, label){
  const empty = value === "" || value === null || (Array.isArray(value) && !value.length);
  if(empty) delete FSTATE.values[key];
  else { FSTATE.values[key] = value; FSTATE.lastApplied = {key, label}; }
  FSTATE.shown = 25;
  refresh();
}

function clearAll(){
  FSTATE.values = {}; FSTATE.preset = null; FSTATE.fromPreset = null;
  FSTATE.beforePreset = null; FSTATE.lastApplied = null; FSTATE.shown = 25;
  syncPresetChips();
  refresh();
}

/* The chips live inside a drawer that may be shut, so their pressed state is set
   from FSTATE rather than from whichever button was last clicked. */
function syncPresetChips(){
  const chips = document.getElementById("presets");
  if(!chips) return;
  const on = FSTATE.fromPreset || FSTATE.preset;
  [...chips.children].forEach(x => x.setAttribute("aria-pressed",
    String(!!on && PRESET_BY_KEY[on] && x.textContent.startsWith(PRESET_BY_KEY[on].label))));
}

async function paintPanel(host){
  let data;
  try { data = await API.filters(fparams()); } catch(e){ return; }
  FILTER_META = data.filters;          // key -> label and option labels, for the match line
  host.innerHTML = "";
  GROUP_ORDER.forEach(g => {
    const inGroup = data.filters.filter(f => f.group === g);
    if(!inGroup.length) return;
    const nOn = inGroup.filter(f =>
      FSTATE.values[f.key] !== undefined ||
      FSTATE.values[f.key + "_min"] !== undefined ||
      FSTATE.values[f.key + "_max"] !== undefined).length;
    const d = el(`<details class="fgroup" ${OPEN_BY_DEFAULT.has(g) || nOn ? "open" : ""}>
      <summary>${esc(g)}${nOn ? `<span class="on">${nOn} active</span>` : ""}</summary>
      <div class="fgrid"></div></details>`);
    const grid = d.querySelector(".fgrid");
    inGroup.forEach(f => grid.append(filterControl(f)));
    host.append(d);
  });
}

async function paintRows(host){
  /* Every filter, the view and any preset are resolved by DuckDB across the full
     universe; this asks for one page and renders it. */
  host.setAttribute("aria-busy", "true");
  let payload;
  try {
    payload = await API.browse(fparams({limit: FSTATE.shown, offset: 0}));
  } catch (e) {
    host.innerHTML = "";
    host.append(el(`<div class="nofilter">Could not reach the query server.
      Start it with <code>python dashboard/serve.py</code> and reload.</div>`));
    return;
  }
  host.removeAttribute("aria-busy");
  host.innerHTML = "";

  /* Narrowed or not, said in one line. With nothing applied the "of" half would be
     the same number twice, so it is dropped; once something is applied the total the
     user started from is the context that makes the result mean anything. */
  const narrowed = payload.total !== payload.universe;
  const fc = document.getElementById("fcount");
  if(fc) fc.innerHTML = narrowed
    ? `Showing <b>${nf(payload.total)}</b> of ${nf(payload.universe)} companies`
    : `Showing <b>${nf(payload.total)}</b> companies`;
  const clear = document.getElementById("fclear");
  if(clear) clear.hidden = !(FSTATE.preset || FSTATE.fromPreset || activeCount());
  const sub = document.getElementById("wl-sub");
  if(sub) sub.textContent = {
    gazette: "Furthest through the insolvency ladder, most recent first",
    lbg: "Held secured lending with LBG and no longer do. Most recently lapsed first",
    all: "All companies, by name"}[payload.view] || "";

  if(!payload.total){
    /* A zero result is usually the last thing the user touched. Name it and offer to
       undo it, rather than showing an empty box that reads as broken. */
    const last = FSTATE.lastApplied;
    const z = el(`<div class="zerostate">
      <b>No companies match this combination.</b><br>
      That is a real result, not an error: these filters describe populations that
      barely overlap.
      ${last ? `<br><br>The last filter applied was <b>${esc(last.label)}</b>.` : ""}
      </div>`);
    if(last){
      const undo = el(`<button>Remove &ldquo;${esc(last.label)}&rdquo;</button>`);
      undo.addEventListener("click", () => {
        if(last.key === "preset"){ removePreset(); }
        else { delete FSTATE.values[last.key];
               delete FSTATE.values[last.key + "_min"];
               delete FSTATE.values[last.key + "_max"]; }
        FSTATE.lastApplied = null;
        renderLanding();
      });
      z.append(undo);
    }
    host.append(z);
    return;
  }

  payload.rows.forEach(c => {
    const life = lifeOf(c.lifecycle);
    const g = c.gazette, l = c.lender || {};
    let middle, right, when;
    if(FSTATE.view === "lbg" || (!g && l.former_lbg)){
      const since = l.months_since_lbg_satisfied;
      middle = `${l.competitors || 0} competitor lender${l.competitors === 1 ? "" : "s"}` +
               (l.primary ? " · now " + esc(prettyLender(l.primary)) : "");
      right = `<div class="wl-stage" style="color:var(--risk-mid)">Former LBG client</div>`;
      when = since == null ? "lapse date unknown"
           : `charge satisfied ${since} month${since === 1 ? "" : "s"} ago`;
    } else if(g){
      const col = STAGE_COLOUR[g.stage] || "var(--risk-mid)";
      const ladder = [1,2,3,4,5].map(i => `<i class="${i<=g.stage?"on":""}"></i>`).join("");
      middle = `${esc(prettyTier(g.severity_tier))} · ${g.notice_count} notice${g.notice_count===1?"":"s"}
                </div><div class="ladder" style="--lad:${col}">${ladder}`;
      right = `<div class="wl-stage" style="color:${col}">${esc(g.stage_label)}</div>`;
      when = "last notice " + fmtDate(g.latest_date);
    } else {
      middle = `${esc(c.sector || "?")}`;
      right = `<div class="wl-stage" style="color:var(--text-faint)">No signal</div>`;
      when = c.status || "";
    }
    const row = el(`
      <button class="wl-row">
        <div>
          <div class="wl-name">${esc(asFiled(c.name))}
            <span class="lifechip" style="color:${life.colour}">${life.label}</span>
            ${FSTATE.view === "lbg" && g ? `<span class="lifechip" style="color:var(--risk-high)">Gazette notice</span>` : ""}</div>
          <div class="wl-meta">${esc(c.number)} · ${esc(c.sector||"?")} · ${esc(c.segment||"?")}</div>
        </div>
        <div><div class="wl-why">${middle}</div></div>
        <div class="wl-right">${right}<div class="wl-when">${esc(when)}</div></div>
      </button>`);
    row.addEventListener("click", () => {
      MATCH_CONTEXT = describeMatch();     // the query that produced this row
      openCompany(c.number);
    });
    host.append(row);
  });

  if(payload.returned < payload.total){
    const more = el(`<button class="more">Show more · ${nf(payload.total - payload.returned)} remaining</button>`);
    more.addEventListener("click", () => { FSTATE.shown += 25; paintRows(host); });
    host.append(more);
  }
}

function wireSearch(){
  const q = document.getElementById("q");
  const box = document.getElementById("cands");
  const close = () => { box.hidden = true; q.setAttribute("aria-expanded","false"); };

  let searchSeq = 0;            // guards against a slow response overwriting a newer one
  q.addEventListener("input", async () => {
    const raw = q.value.trim();
    if(raw.length < 2){ close(); return; }
    const seq = ++searchSeq;

    let payload;
    try {
      payload = await API.search(raw);
    } catch (e) {
      box.innerHTML = "";
      box.append(el(`<div class="cand-empty"><b>Query server unreachable.</b><br>
        Start it with <code>python dashboard/serve.py</code> and reload.</div>`));
      box.hidden = false; q.setAttribute("aria-expanded","true");
      return;
    }
    if(seq !== searchSeq) return;                   // a newer keystroke already answered
    const hits = payload.rows;
    const isNumber = payload.matched_on === "company_number";

    box.innerHTML = "";
    if(!hits.length){
      box.append(el(`<div class="cand-empty">
        <b>No company matches that.</b><br>
        Searched all ${nf(META.universe)} companies by name and number.
        Try a company number, or a shorter part of the name.</div>`));
    } else {
      hits.forEach(c => {
        // An exact company number is certain. A name match never is, which is
        // why the number is the join key everywhere else in the pipeline.
        const conf = isNumber ? 1.00 : 0.92;
        const life = lifeOf(c.lifecycle);
        const b = el(`
          <button class="cand" role="option">
            <span>${esc(asFiled(c.name))}</span>
            <span class="num">${esc(c.number)}</span>
            <span class="conf" style="color:${life.colour}">${life.label}</span>
            <span class="conf">${conf.toFixed(2)} match</span>
          </button>`);
        // A search hit has no query behind it, so it carries no match context.
        b.addEventListener("click", () => { close(); MATCH_CONTEXT = null; openCompany(c.number); });
        box.append(b);
      });
    }
    box.hidden = false; q.setAttribute("aria-expanded","true");
  });

  q.addEventListener("keydown", e => { if(e.key === "Escape") close(); });
  document.addEventListener("click", e => { if(!e.target.closest(".searchbox")) close(); });
}

/* ==========================================================================
   Company page
   ========================================================================== */
/* List rows carry only what a row needs. The company page needs the full record, so it
   is fetched on open rather than every row shipping its detail up front. */
async function openCompany(number){
  try {
    renderCompany(await API.company(number));
  } catch (e) {
    app.innerHTML = "";
    app.append(el(`<section class="panel"><div class="phead"><span class="ma-ico">${maIcon("alert")}</span><p class="eyebrow">Could not load</p></div>
      <p style="margin:0">${esc(String(number))} could not be fetched from the query
      server. ${esc(e.message)}</p></section>`));
  }
}

function renderCompany(c){
  app.innerHTML = "";
  window.scrollTo({top:0});

  const back = el(`<button class="back">&larr; All companies</button>`);
  back.addEventListener("click", renderLanding);
  app.append(back);

  const life = lifeOf(c.lifecycle);
  app.append(el(`
    <section class="panel hero rise">
      <h1>${esc(asFiled(c.name))}</h1>
      <div class="facts">
        <b>${esc(c.number)}</b><span class="sep">·</span>
        <span class="lifechip" style="color:${life.colour}">${life.label}</span>
        <span class="sep">·</span><b>${esc(c.status||"?")}</b>
        ${c.incorporated ? `<span class="sep">·</span> Incorporated ${esc(fmtDate(c.incorporated))}` : ""}
      </div>
      ${c.address ? `<p class="addr">${esc(asFiled(c.address))}</p>` : ""}
      ${c.sic ? `<p class="sic">${esc(c.sic)}</p>` : ""}
      <div class="tagrow">
        ${c.sector ? `<span class="tag">${esc(c.sector)}</span>` : ""}
        ${c.segment ? `<span class="tag">${esc(c.segment)}</span>` : ""}
        ${newsPill(c)}
        ${c.lender && c.lender.former_lbg
          ? `<span class="tag lbg-former" title="Held secured lending with LBG and no longer does. ${nf(META.former_lbg)} companies in the file are in this position.">Former LBG Client</span>` : ""}
      </div>
    </section>`));

  const why = matchPanel();
  if(why) app.append(why);

  const cols = el(`<div class="cols"></div>`);
  app.append(cols);
  cols.append(leftColumn(c));

  const right = el(`<div class="colstack rise" style="animation-delay:.12s"></div>`);
  cols.append(right);

  // The tiles describe every source, not just the Gazette, so they render for every
  // company. Previously they were nested inside the has-a-timeline branch, which meant
  // a company searched for news but carrying no Gazette notice showed no sources at all.
  if(!c.timeline.length){
    right.append(emptyPanel(c));
    right.append(tiles(c));
  } else {
    right.append(timelinePanel(c));
    right.append(tiles(c));
    // Evidence lists linkable Gazette notices. A company whose timeline is entirely
    // property has none, and an empty panel saying so helps nobody.
    if(c.timeline.some(e => e.id)) right.append(evidencePanel(c));
  }

  // Detail panels, below the tiles. Each returns null when it has nothing to say, so a
  // company with no charges does not get an empty borrowing card.
  [borrowingPanel(c), propertyPanel(c), trademarkPanel(c), grantsPanel(c),
   filingPanel(c), momentumPanel(c)].forEach(p => { if(p) right.append(p); });

  app.append(el(`<div class="foot">
    <span>Snapshot ${esc(fmtDate(META.snapshot_date))}</span>
    <span>Connected: ${LIVE.map(s => s.label).join(", ")}</span>
    <span>Prototype, not a live system</span>
  </div>`));
}

function leftColumn(c){
  const wrap = el(`<div class="colstack rise" style="animation-delay:.06s"></div>`);
  const g = c.gazette;

  if(g){
    const col = STAGE_COLOUR[g.stage] || "var(--risk-mid)";
    const ladder = [1,2,3,4,5].map(i => `<i class="${i<=g.stage?"on":""}"></i>`).join("");
    const flags = (g.flags || []).map(f =>
      `<span class="flagchip">${FLAG_LABEL[f] || f}</span>`).join("");

    wrap.append(el(`
      <section class="panel">
        <div class="phead"><span class="ma-ico">${maIcon("alert")}</span><p class="eyebrow">Gazette assessment</p></div>
        <div class="stagehead">
          <b style="color:${col}">${esc(g.stage_label)}</b>
          <span>stage ${g.stage} of 5</span>
        </div>
        <div class="ladder" style="--lad:${col}">${ladder}</div>
        <div style="margin-top:16px">
          <div class="kv"><span>Severity</span><b>${esc(prettyTier(g.severity_tier))}</b></div>
          <div class="kv"><span>Notices</span><b class="mono">${g.notice_count} total · ${g.count_12m} in 12m</b></div>
          <div class="kv"><span>First notice</span><b class="mono">${esc(fmtDate(g.first_date))}</b></div>
          <div class="kv"><span>Last notice</span><b class="mono">${esc(fmtDate(g.latest_date))}</b></div>
          ${g.days_since !== null && g.days_since !== undefined
            ? `<div class="kv"><span>Days since</span><b class="mono">${g.days_since}</b></div>` : ""}
          <div class="kv"><span>Match</span><b class="mono">company number</b></div>
        </div>
        ${flags ? `<div class="flags">${flags}</div>` : ""}
        <p class="disclaimer">Read straight from Gazette notices. These are recorded
        facts with a date and a link, not a score or an opinion.</p>
      </section>`));
  }

  // The left column carries the assessment: what the Gazette says, what the models
  // score, and who the company banks with. Borrowing and filing detail sit in the right
  // column under the source tiles, because stacking all five here left the left column
  // roughly 1,200px taller than the right and the page read as half empty.
  wrap.append(scorePanel(c));
  const lender = lenderPanel(c);
  if(lender) wrap.append(lender);

  return wrap;
}

/* ---------------------------------------------------------------------------
   Model scores.

   Three rules from the handover are enforced here rather than left to whoever
   writes the copy:

   1. Never the word "probability". The raw number runs optimistic exactly at the
      top of the list where this screen looks, so it is labelled "model score",
      used to sort, and described with the hit rate measured on months where the
      outcome was already known.
   2. The horizon always travels with the number. A growth score is about the next
      year and a lending score about the next quarter; side by side without their
      windows they invite a comparison that means nothing.
   3. Voluntary exit is shown as a band and never as a rank. Re-measured against
      this dataset: its top 1,000 holds 14 distinct values, 998 of the 1,000 rows
      are tied, and the top-100 cutoff is shared by 139 companies.
--------------------------------------------------------------------------- */
let MODELS = [];                                        // replaced from META at boot

function pctLabel(pct){
  if(pct <= 1)  return "Top 1%";
  if(pct <= 5)  return "Top 5%";
  if(pct <= 10) return "Top 10%";
  if(pct <= 25) return "Top 25%";
  if(pct <= 50) return "Top half";
  return "Lower half";
}

/* Coarse bands, because the underlying score cannot separate companies finely
   enough at the top to justify a percentile. */
function exitBand(pct){
  if(pct <= 5)  return "High";
  if(pct <= 25) return "Elevated";
  if(pct <= 60) return "Moderate";
  return "Low";
}

function scorePanel(c){
  if(!c.active || !c.scores){
    /* Name the actual status rather than saying "no longer Active".
       "Active - Proposal to Strike off" contains the word Active and shows as Fading,
       so the old wording read as a contradiction of the chip directly above it. The
       models cover status exactly "Active"; anything else is outside the scoring run,
       and that is what this should say. */
    const status = c.status || "not recorded";
    const why = status === "Active - Proposal to Strike off"
      ? `It is filed for strike off, so it sits outside the scored population even though
         its status still begins with "Active".`
      : `Companies in liquidation, administration or receivership sit outside the scored
         population.`;
    return el(`
      <section class="panel pending">
        <div class="phead"><span class="ma-ico">${maIcon("target")}</span><p class="eyebrow">Model scores</p></div>
        <p class="notscored">Not scored &mdash; status is
          &ldquo;${esc(status)}&rdquo;.</p>
        <p class="disclaimer">The four models are fitted only on companies whose status is
        exactly <b>Active</b>: ${nf(META.scored_companies)} of ${nf(META.universe)} in the
        file. ${why} A forecast for such a company would be a number with nothing behind
        it, so nothing is shown rather than a zero.</p>
      </section>`);
  }

  const rows = MODELS.map(m => {
    const s = c.scores[m.key.replace("score_", "")];
    if(!s) return "";
    const band = m.rankable ? pctLabel(s.pct) : exitBand(s.pct) + " band";
    const note = m.rankable
      ? `${Math.round(m.hit_rate * 100)} in 100 at this level went on to ${esc(m.event)} when tested on past months`
      : `not ranked: ${esc(m.not_rankable_because)}`;
    return `
      <div class="scorerow${m.rankable ? "" : " unranked"}">
        <div class="scorehead">
          <b>${esc(m.label)}</b>
          <span class="horizon">${esc(m.horizon)} · ${esc(m.window)}</span>
        </div>
        <div class="scoreband">
          <span class="bandchip">${esc(band)}</span>
          <span class="rawscore">model score ${s.score.toFixed(4)}</span>
        </div>
        <p class="scorenote">${note}</p>
      </div>`;
  }).join("");

  return el(`
    <section class="panel">
      <div class="phead"><span class="ma-ico">${maIcon("target")}</span><p class="eyebrow">Model scores</p></div>
      ${rows}
      <p class="disclaimer">Forecasts about the windows shown, not descriptions of July.
      These are model scores used to rank, not probabilities: the raw value runs high at the
      top of the list, so the band and the measured hit rate are the honest read.</p>
    </section>`);
}

function lenderPanel(c){
  const l = c.lender;
  if(!l) return null;
  const former = !!l.former_lbg;
  const rows = [
    ["Relationship", former ? "Former LBG client" : (l.is_lbg ? "Current LBG client" : "No LBG relationship")],
    ["Outstanding charges", l.outstanding || 0],
    ["Held by LBG", l.lbg_outstanding || 0],
    ["Distinct lenders", l.lenders || 0],
    ["Competitor lenders", l.competitors || 0],
    ["Main lender", l.primary ? prettyLender(l.primary) : "not identified"],
    ["Months since LBG charge created", l.months_since_lbg_created ?? "never"],
    ["Months since LBG charge satisfied", l.months_since_lbg_satisfied ?? "never"],
  ].map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b class="mono">${esc(String(v))}</b></div>`).join("");

  const chips = [
    l.competitor_6m ? "Competitor took a charge in 6m" : "",
    l.competitor_12m ? "Competitor entered in 12m" : "",
    l.lbg_satisfied_6m ? "LBG charge satisfied in 6m" : "",
  ].filter(Boolean).map(t => `<span class="flagchip">${esc(t)}</span>`).join("");

  return el(`
    <section class="panel${former ? " lbgformer" : ""}">
      <div class="phead"><span class="ma-ico">${maIcon("wallet")}</span><p class="eyebrow">Lender relationship</p></div>
      ${former ? `<p class="lbgline">This company held secured lending with LBG and no longer
        does. ${nf(META.former_lbg)} companies in the file are in this position.</p>` : ""}
      ${l.is_lbg && l.months_since_lbg_created != null && l.months_since_lbg_created > 240
        ? `<p class="lbgline">The most recent LBG charge here was created
           ${Math.round(l.months_since_lbg_created / 12)} years ago and carries no satisfaction.
           It counts as outstanding on the register, which is not the same as a live facility.</p>`
        : ""}
      ${rows}
      ${chips ? `<div class="flags">${chips}</div>` : ""}
      <p class="disclaimer">Read from the Companies House charge register. Descriptive only:
      no lender field fed any model score.</p>
    </section>`);
}

/* Title-casing a key turns HSBC into "Hsbc" and NatWest into "Natwest". These are
   proper nouns, so the named ones are spelled out and the rule only covers the rest
   (a key added upstream still renders as something readable rather than raw). */
const LENDER_NAME = {
  natwest: "NatWest", hsbc: "HSBC", barclays: "Barclays", santander: "Santander",
  lbg: "Lloyds (LBG)", lbg_retail: "Lloyds retail", virgin_money: "Virgin Money",
  challenger_bank: "Challenger bank", other_bank: "Other bank",
  asset_invoice_finance: "Asset & invoice finance", insurer_pension: "Insurer or pension",
  trustee_spv: "Trustee / SPV", government: "Government",
};
function prettyLender(k){
  return LENDER_NAME[k] || String(k).replace(/_/g, " ")
    .replace(/\b\w/g, ch => ch.toUpperCase()).replace(/\bLbg\b/, "LBG").replace(/\bSpv\b/, "SPV");
}

function borrowingPanel(c){

function filingPanel(c){

/* What moved in the last twelve months.

   Every field here is tri-state and the panel says which of the three it is. A
   company incorporated eight months ago has no 12-month history, and rendering that
   as "did not relocate" would state a fact nobody checked. 213,566 companies are in
   that position, so the distinction is not an edge case. */
function momentumPanel(c){
  const m = c.momentum;
  if(!m) return null;

  const changes = [
    [m.up, "Moved up a size tier"],
    [m.down, "Moved down a size tier"],
    [m.relocated, "Changed registered address"],
    [m.sic_changed, "Changed primary industry"],
    [m.name_changed, "Changed name"],
    [m.status_changed, "Changed status"],
  ];
  const moved   = changes.filter(([v]) => v === true).map(([, t]) => t);
  const unknown = changes.filter(([v]) => v === null || v === undefined).length;

  const rows = [];
  if(m.months_since_segment_change != null)
    rows.push(["Months since size tier changed", m.months_since_segment_change]);
  if(m.months_in_status != null)
    rows.push(["Months in current status", m.months_in_status]);
  const kv = rows.map(([k, v]) =>
    `<div class="kv"><span>${esc(k)}</span><b class="mono">${esc(String(v))}</b></div>`).join("");

  /* Three outcomes, and the partial one is the trap: a company can have a known
     "status did not change" alongside four fields with no history at all. Reporting
     that as "nothing changed" would turn an unknown into a confirmed negative, which
     is the one thing this file is careful never to do. */
  const gap = unknown
    ? ` ${unknown} of the ${changes.length} checks below have no 12-month history to compare.`
    : "";
  let lead;
  if(unknown === changes.length){
    lead = `<p class="lbgline">No 12-month history yet. This company was incorporated too
      recently for any change to be measured, which is not the same as nothing having changed.</p>`;
  } else if(!moved.length){
    lead = `<p class="lbgline">${unknown ? "No change recorded." : "Nothing changed in the last "
      + "12 months: same size tier, address, industry, name and status."}${gap}</p>`;
  } else {
    lead = `<div class="flags">${moved.map(t =>
      `<span class="flagchip">${esc(t)}</span>`).join("")}</div>`
      + (unknown ? `<p class="lbgline">${gap.trim()}</p>` : "");
  }

  /* States the fact and stops. The earlier wording added "and is not in one now", which
     is false for any company that is distressed today: this flag records that a
     distressed status appears somewhere in the panel history, and says nothing about
     the present. The lifecycle chip at the top of the page is what reports today. */
  const prior = m.ever_distressed === true
    ? `<p class="lbgline warn">Has held a distressed status at some point in the
       Companies House panel history.</p>`
    : "";

  return el(`
    <section class="panel">
      <div class="phead"><span class="ma-ico">${maIcon("curve")}</span><p class="eyebrow">Change in the last 12 months</p></div>
      ${lead}
      ${prior}
      ${kv}
      <p class="disclaimer">Measured against the same month last year in the Companies House
      panel. A blank here means no history to compare, never a confirmed "no change".</p>
    </section>`);
}

/* The timeline is now genuinely more than one source, so each entry carries its own
   colour and label instead of every row being stamped "Gazette". Entries arrive sorted
   by date, so distress notices and property purchases interleave and the order of
   events reads as the company's actual history. */
/* Trade marks. Everything here is stated as at January 2018, because that is where the

    <section class="panel">
      <div class="phead"><span class="ma-ico">${maIcon("tag")}</span><p class="eyebrow">Trade marks</p></div>
      <p class="lbgline warn">Counted as at ${esc(fmtDate(t.asof))}. The Intellectual Property
      Office published this bulk register once, in February 2018, and has never updated it,
      so nothing after that date appears here for any company. A mark registered then may
      have lapsed since.</p>
      ${kv}
      <p class="disclaimer">Matched on company name and postcode area at confidence
      ${t.confidence ? t.confidence.toFixed(2) : "0.85"}, the weakest match of the three
      external packs: there is no company number in the IPO file. Treat it as a strong
      identification rather than a certain one.</p>

}

/* UKRI research funding. No dates exist in this source, so there is nothing to put on the
   timeline and the panel says why rather than leaving a reader wondering. The match is by
   name and postcode, never by company number, and that is stated on the row rather than

function grantsPanel(c){

  ].map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b class="mono">${esc(String(v))}</b></div>`).join("");

    <section class="panel">
      <div class="phead"><span class="ma-ico">${maIcon("flask")}</span><p class="eyebrow">Research funding</p></div>
      ${!g.projects ? `<p class="lbgline">A UKRI organisation matched this company, but no
        projects are listed against it.</p>` : ""}
      ${g.organisations > 1 ? `<p class="lbgline">Counts are aggregated across
        ${g.organisations} UKRI organisations that matched this company's name and postcode.
        They may not all be the same entity.</p>` : ""}
      ${rows}
      <p class="disclaimer">UKRI Gateway to Research, harvested ${esc(fmtDate(g.asof))}. Matched
      on name and postcode because UKRI publishes no company number, so this is a strong
      identification rather than a certain one. The source carries no dates, which is why
      grants never appear on the timeline above.</p>
    </section>`);

}

/* Property summary. The title count is never adjusted, but above the 99th percentile the
   page says what a number that size usually means, because "7,266 properties" read as a

function propertyPanel(c){

  if(!p) return null;

    ["Titles held", nf(p.titles)],
    ["Freehold", nf(p.freehold)],
    ["Leasehold", nf(p.leasehold)],

  }

    <section class="panel">
      <div class="phead"><span class="ma-ico">${maIcon("home")}</span><p class="eyebrow">Property</p></div>

        ? `Price paid is recorded on ${nf(p.value_count)} of these titles, so any total covers

        : `No price is recorded against these titles, which is normal: the register carries one

    </section>`);
}

/* The single place that decides what can honestly be said about one source for one
   company. The tile grid and the empty panel both read it, so the two can never
   contradict each other about whether we actually looked.

   `checked` is the claim that matters. It is only true when this company was really
   searched, which for news is 96 companies rather than the whole universe. */
function sourceState(c, s){
  if(!s.live) return {state:"wait", checked:false, val:"not connected yet", sub:""};

  if(s.key === "gazette"){
    // The whole universe was scanned against the Gazette, so an absence here is a result.
    const g = c.gazette;
    return g
      ? {state:"on", checked:true, val:`${g.notice_count} notice${g.notice_count===1?"":"s"}`,
         sub:`most recent ${fmtDate(g.latest_date)}`}
      : {state:"off", checked:true, val:"checked, nothing found", sub:""};
  }

  if(s.key === "news"){
    /* Three states, not two. Only a 96 company sample was searched, so for everyone
       else the honest answer is "we have not looked", which is not the same as
       "nothing found". Claiming the latter would overstate what we know.

       The tile itself stays short. Anything that needs explaining, the articles that
       confirmed coverage or the ones verification threw out, lives in the panel the
       tile opens, so the grid does not fill up with headlines. */
    const n = c.news;
    if(!n) return {state:"wait", checked:false, val:"not searched",
                   sub:`${nf((META.news||{}).searched)} of ${nf(META.universe)} companies sampled`};
    if(n.verified > 0) return {state:"on", checked:true, detail:true,
                   val:`${n.verified} article${n.verified===1?"":"s"}`,
                   sub:`${n.sentiment_label||"coverage found"} · tap for sources`};
    /* The second run shipped counts without article titles, so the tile must not offer
       to show articles it does not have. The panel is still worth opening for the source,
       window and counts. */
    if(n.raw_hits > 0) return {state:"off", checked:true, detail:true,
                   val:"No news visibility.",
                   sub:`${n.raw_hits} match${n.raw_hits===1?"":"es"} rejected`
                       + ((n.rejected || []).length ? " · tap to see why" : "")};
    return {state:"off", checked:true, val:"No news visibility.",
            sub:`searched ${fmtDate(n.searched)} · ${n.window_years}yr window`};
  }

  if(s.key === "contracts"){
    /* Deliberately two months behind the rest of the file. Find a Tender's feed ends
       5 June 2026, so June and July coverage is partial and would make companies look
       like they stopped winning work, which is the wrong signal to hand a relationship
       manager. Stale but structurally correct beats current but biased. */
    const k = c.contracts;
    const asof = fmtDate(META.contracts_asof || "2026-05-01");
    if(!k) return {state:"off", checked:true, val:"none found", sub:`as at ${asof}`};
    // Lead with whichever fact is actually useful. "0 in 12m" as a headline buries the
    // fact that this company has won public work at all, which is the rarer signal: only
    // about 1% of the file ever has.
    const n = k.won_12m || 0;
    return {state:"on", checked:true,
            val: n > 0 ? `${n} in 12 months`
                       : (k.months_since == null ? "won previously" : `last won ${k.months_since}m ago`),
            sub: n > 0 && k.months_since != null
                 ? `as at ${asof} · ${k.months_since}m since last`
                 : `as at ${asof}`};
  }

  if(s.key === "property"){
    /* Every company was checked against the Land Registry file on company number, so an
       absence here is a result in the same way the Gazette's is. */
    const p = c.property;
    const asof = fmtDate((META.property || {}).asof);
    if(!p) return {state:"off", checked:true, val:"none held", sub:`as at ${asof}`};
    return {state:"on", checked:true,
            val: `${nf(p.titles)} title${p.titles === 1 ? "" : "s"}`,
            sub: p.large_holder ? `as at ${asof} · not a trading portfolio`
                                : `latest ${fmtDate(p.latest_date)}`};
  }

  if(s.key === "trademark"){
    /* The vintage travels with the number, always. Without it a reader sees "last mark
       2014" and concludes the company stopped investing in its brand, when what actually
       stopped is the register: the IPO's free extract ends on 28 January 2018. */
    const t = c.trademarks;
    const vintage = "register to " + fmtDate((META.trademark || {}).asof);
    if(!t) return {state:"off", checked:true, val:"none found", sub:vintage};
    return {state:"on", checked:true,
            val:`${nf(t.total)} mark${t.total === 1 ? "" : "s"}`, sub:vintage};
  }

  if(s.key === "grants"){
    /* Weaker than the Gazette or property absence and the wording says so. This is a name
       and postcode match, and 45% of UKRI organisations publish no postcode at all, so a
       company with no row may be unfunded or may simply have been unmatchable. */
    const g = c.grants;
    if(!g) return {state:"off", checked:true, val:"no match",
                   sub:`name match only · as at ${fmtDate((META.grants || {}).asof)}`};
    if(!g.projects) return {state:"on", checked:true, val:"organisation matched",
                            sub:"no projects listed"};
    return {state:"on", checked:true,
            val:`${nf(g.projects)} project${g.projects === 1 ? "" : "s"}`,
            sub:g.organisations > 1 ? `across ${g.organisations} matched organisations`
                                    : `matched at confidence ${g.confidence.toFixed(2)}`};
  }

  return {state:"wait", checked:false, val:"not connected yet", sub:""};
}

/* The quick-look pill. Deliberately the same three states as the tile, because a
   company that reads "No news coverage" at the top and "not searched" lower down
   would be telling the reader two different things. */
function newsPill(c){
  const n = c.news, m = META.news || {};
  if(!n) return `<span class="tag news-unknown" title="Only ${nf(m.searched)} of ${nf(META.universe)} companies were searched for news, and this is not one of them. Its news visibility is unknown rather than absent.">News not searched</span>`;
  if(n.verified > 0) return `<span class="tag news-yes">Found news coverage</span>`;
  return `<span class="tag news-no" title="Searched on ${esc(fmtDate(n.searched))} over a ${n.window_years} year window. Nothing found that is verifiably about this company.">No news coverage</span>`;
}

/* Opened from the News tile. Shows the articles behind the number, whether they were
   confirmed or rejected, each with a link so a reader can check the call themselves. */
function newsDetail(c){
  const n = c.news;
  const src = (n.source || "").charAt(0).toUpperCase() + (n.source || "").slice(1);
  const panel = el(`<section class="panel">
    <div class="phead"><span class="ma-ico">${maIcon("news")}</span><p class="eyebrow">News coverage</p></div>
    <div class="kv"><span>Source</span><b>${esc(src)}</b></div>
    <div class="kv"><span>Searched</span><b class="mono">${esc(fmtDate(n.searched))}</b></div>
    <div class="kv"><span>Window</span><b class="mono">${n.window_years} years</b></div>
    <div class="kv"><span>Articles matched</span><b class="mono">${n.raw_hits}</b></div>
    <div class="kv"><span>Confirmed as this company</span><b class="mono">${n.verified}</b></div>
    <div class="ev-links" style="margin-top:14px" id="newsev"></div>
    <p class="disclaimer" id="newsnote"></p>
  </section>`);

  const host = panel.querySelector("#newsev");
  (n.articles || []).forEach(a => host.append(el(
    `<a class="ev-link" href="${esc(a.url||"#")}" target="_blank" rel="noopener">
       ${esc(a.title)} <span class="conf-chip">confirmed</span></a>`)));
  (n.rejected || []).forEach(a => host.append(el(
    `<a class="ev-link rejected" href="${esc(a.url||"#")}" target="_blank" rel="noopener">
       ${esc(a.title)} <span class="conf-chip">rejected</span></a>`)));

  panel.querySelector("#newsnote").textContent = n.verified > 0
    ? "Each article was checked against this company before being counted: the name has to appear in the headline or standfirst, and the piece has to carry a matching town, sector or business context."
    : n.raw_hits > 0
    ? "The search matched these articles on the company name, then verification rejected every one of them. The name appeared inside an unrelated word or belonged to a different subject entirely, so counting them as coverage of this company would have been wrong."
    : "Searched and nothing was returned. That is a result rather than a gap: this company has no Guardian coverage in the window.";

  /* An article that passed the automated check and was then rejected on review. Saying so
     is the point: it shows the verification working rather than hiding a near miss. */
  if(n.excluded_note){
    panel.append(el(`<p class="disclaimer"><b>One article passed the automated check and
      was rejected on review.</b> ${esc(n.excluded_note)}</p>`));
  }
  return panel;
}

function tiles(c){
  const wrap = el(`<div class="tilewrap"></div>`);
  const host = el(`<div class="tiles"></div>`);
  const detail = el(`<div class="tiledetail" hidden></div>`);
  wrap.append(host, detail);

  SOURCES.forEach(s => {
    const st = sourceState(c, s);
    const tag = st.detail ? "button" : "div";
    const tile = el(`
      <${tag} class="tile ${st.state}${st.detail ? " tappable" : ""}"
              ${st.detail ? 'aria-expanded="false"' : ""}>
        <div class="tile-head"><span class="ma-ico">${maIcon(s.icon)}</span>
          <span class="tile-name">${esc(s.label)}</span></div>
        <div class="tile-val">${esc(st.val)}</div>
        ${st.sub ? `<div class="tile-sub">${esc(st.sub)}</div>` : ""}
      </${tag}>`);

    if(st.detail){
      tile.addEventListener("click", () => {
        const open = tile.getAttribute("aria-expanded") === "true";
        tile.setAttribute("aria-expanded", String(!open));
        detail.hidden = open;
        detail.innerHTML = "";
        if(!open) detail.append(newsDetail(c));
      });
    }
    host.append(tile);
  });
  return wrap;
}

function evidencePanel(c){
  const links = c.timeline.filter(e => e.id);
  const panel = el(`<section class="panel">
    <div class="phead"><span class="ma-ico">${maIcon("link")}</span><p class="eyebrow">Evidence</p></div><div class="ev-links" id="evl"></div>
  </section>`);
  const evl = panel.querySelector("#evl");
  if(!links.length){
    evl.append(el(`<p style="margin:0;color:var(--text-dim);font-size:13px">
      No linkable evidence for this company.</p>`));
  }
  links.forEach(e => {
    evl.append(el(`<a class="ev-link" href="${esc(STEM + e.id)}" target="_blank" rel="noopener">
      Gazette notice <span class="k">${esc(e.id)}</span>
      <span class="conf-chip">certain match</span></a>`));
  });
  return panel;
}

function emptyPanel(c){
  // A tick means we looked at THIS company, which is not the same as the source
  // being live. News is live but only ran on a 96 company sample, so most companies
  // get a dash here rather than a tick they did not earn.
  const rows = SOURCES.map(s => {
    const st = sourceState(c, s);
    return `
    <div>
      <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        ${st.checked ? '<path d="m5 13 4 4L19 7"/>' : '<path d="M6 12h12"/>'}</svg>
      ${esc(s.label)}<span>${esc(st.checked ? st.val : st.val)}</span>
    </div>`;
  }).join("");
  return el(`
    <section class="panel nothing">
      <img class="nothing-horse" src="assets/horse-mark.png" alt="" aria-hidden="true" onerror="this.remove()">
      <h2>Nothing found for this company.</h2>
      <p>This is a result, not an error. Only ${nf(META.companies_with_signal)} of the
      ${nf(META.universe)} companies we hold carry a Gazette signal at all.
      For a company the model has flagged, an absence of distress notices is itself
      worth knowing.</p>
      <div class="checked">${rows}</div>
    </section>`);
}

/* ========================================================================== */
/* Boot. META is fetched once so the renderers can keep reading it synchronously,
   then the landing page draws itself from the API. */
(async () => {
  try {
    META = await API.meta();
  } catch (e) {
    app.innerHTML = `<section class="panel"><div class="phead"><span class="ma-ico">${maIcon("alert")}</span><p class="eyebrow">Query server not running</p></div>
      <p style="margin:0">This dashboard now reads all
      <b>1,531,094</b> companies from DuckDB rather than a baked file. Start the server
      with <code>python dashboard/serve.py</code>, then reload this page.</p>
      <p class="disclaimer">${String(e.message)}</p></section>`;
    return;
  }
  // The header ships a hardcoded date so the page is not blank before META arrives.
  // Overwrite it now, or it silently shows a date the data has moved past.
  document.getElementById("snap").textContent = fmtDate(META.snapshot_date);
  LIVE_KEYS = new Set(META.sources_live || ["gazette"]);
  SOURCES.forEach(s => s.live = LIVE_KEYS.has(s.key));
  LIVE = SOURCES.filter(s => s.live);
  MODELS = META.score_models || [];
  STEM = META.notice_url_stem || STEM;
  renderLanding();
})();
</script>
