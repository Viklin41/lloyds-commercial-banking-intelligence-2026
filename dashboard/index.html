<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Companies House Data Store · Lloyds Commercial Banking</title>
<style>
/* ==========================================================================
   Tokens
   ========================================================================== */
:root{
  /* Lloyds greens. Approximate, confirm against brand guidelines before use. */
  --green-brand:  #006A4D;
  --green-deep:   #053D2C;
  --green-deeper: #01251A;
  --jade:         #00C48C;
  --mint:         #7FE7C4;

  --risk-high:  #E0574C;
  --risk-mid:   #E9A23B;
  --positive:   #56D9A6;

  /* Lifecycle */
  --life-trading:    #56D9A6;
  --life-fading:     #E9A23B;
  --life-distressed: #F0784A;
  --life-insolvent:  #E0574C;

  --glass:        rgba(255,255,255,.075);
  --glass-strong: rgba(255,255,255,.12);
  --edge:         rgba(255,255,255,.15);
  --edge-bright:  rgba(255,255,255,.26);

  --text:      #EAF3EF;
  --text-dim:  #9DB3AB;
  --text-faint:#6E8781;

  --font-ui: "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-display: "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-mono: "Cascadia Mono",Consolas,ui-monospace,"SF Mono",monospace;

  --r: 14px;
  --blur: blur(20px) saturate(1.25);
}

*{box-sizing:border-box}
body{
  margin:0;font-family:var(--font-ui);font-size:14px;line-height:1.5;
  color:var(--text);background:var(--green-deeper);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}

.bg{position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(1000px 700px at 6% -12%, rgba(0,214,152,.30), transparent 58%),
    radial-gradient(820px 820px at 96% 2%, rgba(0,138,101,.42), transparent 60%),
    radial-gradient(700px 520px at 45% 118%, rgba(0,80,58,.55), transparent 62%),
    linear-gradient(168deg, #07523A 0%, var(--green-deep) 38%, var(--green-deeper) 78%, #011710 100%);
}
.bg-horse{position:fixed;right:-7vw;bottom:-14vh;z-index:-1;
  width:min(42vw,560px);height:auto;opacity:.13;pointer-events:none;
  filter:drop-shadow(0 0 70px rgba(0,0,0,.45));}

/* ==========================================================================
   Chrome
   ========================================================================== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:12px 24px;background:rgba(3,45,33,.62);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--edge)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--jade) 18%,var(--mint) 50%,var(--jade) 82%,transparent);
  opacity:.5}
/* The official mark is black, the bar is dark green. A white chip keeps the
   asset unmodified and still legible. */
.markwrap{display:flex;align-items:center;justify-content:center;flex:none;
  background:#fff;border-radius:10px;padding:7px 12px;height:52px;
  box-shadow:0 2px 12px rgba(0,0,0,.28)}
/* The supplied asset is the full lockup, so it gets room to stay legible and
   is never cropped. The inline fallback has no intrinsic size, so it needs an
   explicit width. */
.mark{height:38px;max-width:150px;width:auto;color:#0B0B0B;display:block}
.markwrap > svg.mark{width:34px}
.divider{width:1px;height:28px;background:var(--edge);flex:none}
.wordmark{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;font-size:15px}
.wordmark span{display:block;font-family:var(--font-ui);font-weight:400;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-top:1px}
.snapshot{margin-left:auto;display:flex;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);
  padding:6px 12px;border:1px solid var(--edge);border-radius:99px;background:var(--glass)}
.snapshot b{color:var(--mint);font-weight:600}
.dot{width:6px;height:6px;border-radius:99px;background:var(--jade);flex:none}

.wrap{max-width:1180px;margin:0 auto;padding:34px 24px 90px}

/* ==========================================================================
   Landing
   ========================================================================== */
.lede{font-family:var(--font-display);font-size:clamp(28px,4.4vw,42px);font-weight:600;
  letter-spacing:-.03em;line-height:1.08;margin:8px 0 8px}
.sub{color:var(--text-dim);max-width:60ch;margin:0 0 24px;font-size:15px}
.sub small{display:block;font-size:12.5px;color:var(--text-faint);margin-top:6px}

.searchbox{position:relative;max-width:560px}
.searchbox input{width:100%;padding:15px 17px 15px 46px;position:relative;z-index:1;
  font-family:var(--font-ui);font-size:15px;color:var(--text);
  background:var(--glass-strong);backdrop-filter:var(--blur);
  border:1px solid var(--edge-bright);border-radius:12px;outline:none;
  transition:border-color .18s, box-shadow .18s}
.searchbox input::placeholder{color:var(--text-faint)}
.searchbox input:focus{border-color:var(--jade);box-shadow:0 0 0 4px rgba(0,196,140,.18)}
.searchbox > svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:2;
  width:17px;height:17px;color:var(--text-faint);pointer-events:none}

.candidates{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:30;
  max-height:340px;overflow:auto;
  background:rgba(3,46,34,.94);backdrop-filter:var(--blur);
  border:1px solid var(--edge-bright);border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.5)}
.candidates[hidden]{display:none}
.cand{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 15px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.05);
  color:var(--text);font-family:var(--font-ui);font-size:13.5px;cursor:pointer}
.cand:last-child{border-bottom:0}
.cand:hover,.cand:focus-visible{background:rgba(0,196,140,.15);outline:none}
.cand .num{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)}
.cand .conf{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);white-space:nowrap}
.cand-empty{padding:16px 15px;color:var(--text-dim);font-size:13.5px;line-height:1.55}
.cand-empty b{color:var(--text);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:30px 0 0}
.stat{padding:16px 18px;border-radius:12px;background:var(--glass);
  border:1px solid var(--edge);backdrop-filter:var(--blur)}
.stat b{display:block;font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--text-dim);display:block;margin-top:3px}

/* ==========================================================================
   Shared
   ========================================================================== */
.panel{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--edge);border-radius:var(--r);padding:20px 22px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-faint);margin:0 0 14px;font-weight:600}
.lifechip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;
  border:1px solid currentColor;white-space:nowrap}

/* ==========================================================================
   Watchlist
   ========================================================================== */
.watchlist{margin-top:44px}
.wl-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.wl-head h2{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.wl-head p{margin:0;color:var(--text-faint);font-size:12.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;
  background:var(--glass);border:1px solid var(--edge);color:var(--text-dim);
  font-family:var(--font-ui);font-size:12.5px;cursor:pointer;transition:all .16s}
.fchip .n{font-family:var(--font-mono);font-size:11px;opacity:.8}
.fchip .swatch{width:8px;height:8px;border-radius:99px;background:currentColor}
.fchip:hover{border-color:var(--edge-bright)}
.fchip[aria-pressed="true"]{color:var(--text);background:var(--glass-strong);
  border-color:currentColor}
.fchip:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

.wl-row{display:grid;grid-template-columns:1fr 200px 158px;gap:18px;align-items:center;
  width:100%;text-align:left;padding:15px 20px;margin-bottom:8px;cursor:pointer;
  background:var(--glass);backdrop-filter:var(--blur);
  border:1px solid var(--edge);border-radius:12px;color:var(--text);
  font-family:var(--font-ui);font-size:14px;
  transition:border-color .18s, transform .18s, background .18s}
.wl-row:hover,.wl-row:focus-visible{border-color:rgba(0,196,140,.55);
  background:var(--glass-strong);transform:translateX(3px);outline:none}
.wl-name{font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wl-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);margin-top:4px}
.wl-why{font-size:12.5px;color:var(--text-dim)}
.wl-right{text-align:right}
.wl-stage{font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:-.01em}
.wl-when{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:3px}
.more{display:block;width:100%;margin-top:6px;padding:12px;border-radius:12px;
  background:none;border:1px dashed var(--edge);color:var(--text-dim);
  font-family:var(--font-ui);font-size:13px;cursor:pointer}
.more:hover,.more:focus-visible{border-color:var(--jade);color:var(--mint);outline:none}
.nofilter{padding:22px;border:1px dashed var(--edge);border-radius:12px;color:var(--text-dim);font-size:13.5px}

.ladder{display:flex;gap:3px;margin-top:8px}
.ladder i{flex:1;height:5px;border-radius:2px;background:rgba(255,255,255,.10)}
.ladder i.on{background:var(--lad)}

/* ==========================================================================
   Company page
   ========================================================================== */
.back{display:inline-flex;align-items:center;gap:7px;margin-bottom:20px;
  background:none;border:0;color:var(--text-dim);font-family:var(--font-ui);
  font-size:13px;cursor:pointer;padding:6px 2px}
.back:hover,.back:focus-visible{color:var(--mint);outline:none}

.hero{position:relative;overflow:hidden;padding:28px 30px}
.hero h1{font-family:var(--font-display);font-size:clamp(22px,3.2vw,31px);font-weight:600;
  letter-spacing:-.025em;margin:0 0 10px;line-height:1.12;max-width:26ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;
  font-family:var(--font-mono);font-size:12px;color:var(--text-dim)}
.facts b{color:var(--text);font-weight:500}
.facts .sep{color:var(--text-faint)}
.addr{margin:12px 0 0;color:var(--text-dim);font-size:12.5px;letter-spacing:.02em}
.tagrow{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:4px 11px;border-radius:99px;
  background:rgba(255,255,255,.07);border:1px solid var(--edge);color:var(--text-dim)}

/* Both columns are flex stacks with a gap, so nothing depends on margin
   collapsing and no panel can ride up into the one above it. */
.cols{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-top:16px;align-items:start}
.colstack{display:flex;flex-direction:column;gap:16px;min-width:0}

.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--text-dim)}
.kv b{font-weight:600;text-align:right}
.kv .mono{font-family:var(--font-mono);font-size:12px;font-weight:500}

.stagehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.stagehead b{font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:-.015em}
.stagehead span{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.flagchip{font-size:11.5px;padding:4px 10px;border-radius:99px;
  background:rgba(224,87,76,.12);border:1px solid rgba(224,87,76,.38);color:#F09A92}
.pending{opacity:.55}
.pending .kv b{color:var(--text-faint);font-weight:400;font-style:italic}
.disclaimer{margin:14px 0 0;padding-top:13px;border-top:1px solid var(--edge);
  font-size:11.5px;color:var(--text-faint);line-height:1.5}

.spine{position:relative;padding-left:26px}
.spine::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;
  background:linear-gradient(180deg,transparent,var(--edge-bright) 12%,var(--edge-bright) 88%,transparent)}
.ev{position:relative;display:grid;grid-template-columns:96px 96px 1fr;gap:14px;
  align-items:baseline;padding:9px 0}
.ev::before{content:"";position:absolute;left:-25px;top:15px;width:11px;height:11px;
  border-radius:99px;background:var(--src);border:2px solid #063826;
  box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.ev-date{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)}
.ev-src{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--src);font-weight:600}
.ev-detail{font-size:13.5px}
.ev-detail a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.18)}
.ev-detail a:hover,.ev-detail a:focus-visible{color:var(--mint);border-color:var(--mint);outline:none}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.tile{padding:15px 16px;border-radius:12px;background:var(--glass);
  border:1px solid var(--edge);backdrop-filter:var(--blur)}
.tile.on{border-color:rgba(0,196,140,.45);background:rgba(0,196,140,.10)}
.tile.wait{border-style:dashed;opacity:.6}
.tile-name{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-faint);font-weight:600}
.tile-val{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:7px}
.tile.off .tile-val,.tile.wait .tile-val{font-size:13px;font-weight:400;color:var(--text-faint);
  font-family:var(--font-ui);letter-spacing:0}
.tile-sub{font-size:11.5px;color:var(--text-dim);margin-top:3px}

.ev-links{display:flex;flex-wrap:wrap;gap:8px}
.ev-link{display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;
  background:var(--glass);border:1px solid var(--edge);color:var(--text);
  text-decoration:none;font-size:12.5px;transition:border-color .18s,background .18s}
.ev-link:hover,.ev-link:focus-visible{border-color:var(--jade);background:rgba(0,196,140,.14);outline:none}
.ev-link .k{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint)}
.conf-chip{font-family:var(--font-mono);font-size:10.5px;padding:2px 7px;border-radius:99px;
  background:rgba(255,255,255,.07);color:var(--text-dim);border:1px solid var(--edge)}

.nothing{position:relative;overflow:hidden;padding:38px 32px}
.nothing-horse{position:absolute;right:18px;bottom:-30px;width:200px;height:auto;opacity:.16;pointer-events:none}
.nothing h2{font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0 0 10px}
.nothing p{color:var(--text-dim);max-width:54ch;margin:0 0 22px}
.checked{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 26px;max-width:660px}
.checked div{display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.checked span{margin-left:auto;font-size:11.5px;color:var(--text-faint)}
.tick{width:14px;height:14px;color:var(--text-faint);flex:none}

.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--edge);
  font-size:11.5px;color:var(--text-faint);display:flex;gap:16px;flex-wrap:wrap}

.rise{animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .wl-row:hover{transform:none}
}
@media (max-width:880px){
  .cols{grid-template-columns:1fr}
  .wl-row{grid-template-columns:1fr 140px}
  .wl-why{display:none}
  .ev{grid-template-columns:88px 1fr;gap:4px 12px}
  .ev-src,.ev-detail{grid-column:2}
}
</style>
</head>
<body>

<div class="bg"></div>

<img class="bg-horse" src="assets/horse-mark.png" alt="" aria-hidden="true"
     onerror="this.remove()">

<header class="topbar">
  <span class="markwrap" id="brand"></span>
  <span class="divider"></span>
  <div class="wordmark">Companies House Data Store<span>Minimum Viable Prototype</span></div>
  <div class="snapshot"><i class="dot"></i>Data as of <b id="snap">30 June 2026</b></div>
</header>

<main class="wrap" id="app"></main>

<script src="data.js"></script>
<script>
/* ==========================================================================
   Brand mark. Try the official asset, fall back to the drawn placeholder.
   ========================================================================== */
(function brand(){
  const host = document.getElementById("brand");
  const tries = ["assets/lloyds-logo.svg", "assets/lloyds-logo.png",
                 "Lloyds_Banking_Group_Logo.png", "Lloyds-Bank-Symbol.png"];
  let i = 0;
  const attempt = () => {
    if(i >= tries.length){ host.remove(); return; }   // no asset, no white box
    const img = new Image();
    img.onload = () => { img.className = "mark"; img.alt = "Lloyds"; host.replaceChildren(img); };
    img.onerror = () => { i++; attempt(); };
    img.src = tries[i];
  };
  attempt();
})();

/* ==========================================================================
   The store. Built by dashboard/build_data.py from the NB10 Gazette work.
   The screen reads it and nothing else: no fetching, no matching, no scoring.
   ========================================================================== */
const STORE = window.STORE || {meta:{}, companies:[]};
const META = STORE.meta || {};
const COMPANIES = STORE.companies || [];
const BY_NUMBER = new Map(COMPANIES.map(c => [c.number, c]));
const STEM = META.notice_url_stem || "https://www.thegazette.co.uk/id/notice/";

/* "live" sources are wired to a real adapter. The rest are declared pending
   rather than shown as zero, because we have not looked yet and saying
   "nothing found" would not be true. */
const SOURCES = [
  {key:"gazette",   label:"Gazette",     colour:"#E0574C", live:true},
  {key:"news",      label:"News",        colour:"#8FB8FF", live:false},
  {key:"contracts", label:"Contracts",   colour:"#56D9A6", live:false},
  {key:"hiring",    label:"Hiring",      colour:"#E9A23B", live:false},
  {key:"property",  label:"Property",    colour:"#C9A6FF", live:false},
  {key:"trademark", label:"Trade marks", colour:"#7FE7C4", live:false},
  {key:"grants",    label:"Grants",      colour:"#9DB3AB", live:false}
];
const LIVE = SOURCES.filter(s => s.live);

/* Lifecycle. Trading, fading and finished mean different things to a
   relationship manager, so they are never merged into one list. */
const LIFECYCLE = [
  {key:"Trading",    label:"Still trading", colour:"var(--life-trading)",
   note:"Active on the register", on:true},
  {key:"Fading",     label:"Fading",        colour:"var(--life-fading)",
   note:"Proposal to strike off", on:true},
  {key:"Distressed", label:"Distressed",    colour:"var(--life-distressed)",
   note:"Voluntary arrangement or receiver appointed", on:true},
  {key:"Insolvent",  label:"Insolvent",     colour:"var(--life-insolvent)",
   note:"Liquidation or administration", on:false}
];
const lifeOf = k => LIFECYCLE.find(l => l.key === k) || {label:k, colour:"var(--text-dim)", note:""};

const STAGE_COLOUR = {1:"var(--risk-mid)",2:"var(--risk-mid)",3:"var(--risk-high)",
                      4:"var(--risk-high)",5:"var(--risk-high)"};

/* ==========================================================================
   Helpers
   ========================================================================== */
const el = h => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstChild; };
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = n => (n ?? 0).toLocaleString("en-GB");

function fmtDate(v){
  if(!v) return "";
  let d;
  if(/^\d{4}-\d{2}-\d{2}/.test(v)) d = new Date(v.slice(0,10)+"T00:00:00");
  else if(/^\d{2}\/\d{2}\/\d{4}$/.test(v)){ const [a,b,c]=v.split("/"); d=new Date(`${c}-${b}-${a}T00:00:00`); }
  else return v;
  return isNaN(d) ? v : d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
}
/* Companies House stores names and addresses in capitals. We show them as
   filed, because title casing mangles acronyms and postcodes. */
const asFiled = s => String(s || "").trim();
const prettyTier = s => {
  const t = String(s || "").replace(/_/g, " ").toLowerCase();
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : "";
};
const FLAG_LABEL = {active_case:"Case still open", court:"Court involved",
  progressed:"Escalated a stage", recurring:"Recurring distress",
  recent_90d:"Notice in last 90 days"};

/* Rank: furthest through the distress ladder first, then most recent. */
const rank = c => {
  const g = c.gazette; if(!g) return -1;
  return (g.stage||0)*1000 - Math.min(g.days_since ?? 9999, 999);
};

document.getElementById("snap").textContent = fmtDate(META.snapshot_date);

/* ==========================================================================
   Landing
   ========================================================================== */
let shown = 12;
let active = new Set(LIFECYCLE.filter(l => l.on).map(l => l.key));

function renderLanding(){
  app.innerHTML = "";
  const byLife = META.flagged_by_lifecycle || {};
  const actionable = LIFECYCLE.filter(l => l.on)
    .reduce((s,l) => s + (byLife[l.key]||0), 0);

  app.append(el(`
    <section class="rise">
      <h1 class="lede">Companies House Data Store</h1>
      <p class="sub">Search any company by name or number.</p>
      <div class="searchbox">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Company name or number" autocomplete="off"
               aria-label="Search by company name or number" aria-expanded="false" />
        <div class="candidates" id="cands" hidden role="listbox"></div>
      </div>
      <div class="stats">
        <div class="stat"><b>${nf(META.companies_with_signal)}</b>
          <span>companies carrying a Gazette signal</span></div>
        <div class="stat"><b>${nf(actionable)}</b>
          <span>of those still trading or fading</span></div>
        <div class="stat"><b>${nf(META.signal_rows)}</b>
          <span>notices behind them</span></div>
        <div class="stat"><b>1 of 7</b>
          <span>sources connected so far</span></div>
      </div>
    </section>`));

  const wl = el(`
    <section class="watchlist rise" style="animation-delay:.08s">
      <div class="wl-head">
        <h2>Flagged for review</h2>
        <p>Furthest through the insolvency ladder, most recent first</p>
      </div>
      <div class="filters" id="filters"></div>
      <div id="wlrows"></div>
    </section>`);
  app.append(wl);

  const fhost = wl.querySelector("#filters");
  LIFECYCLE.forEach(l => {
    const n = byLife[l.key] || 0;
    const chip = el(`
      <button class="fchip" aria-pressed="${active.has(l.key)}"
              style="color:${active.has(l.key) ? l.colour : ""}" title="${esc(l.note)}">
        <i class="swatch" style="background:${l.colour}"></i>
        ${l.label} <span class="n">${nf(n)}</span>
      </button>`);
    chip.addEventListener("click", () => {
      active.has(l.key) ? active.delete(l.key) : active.add(l.key);
      shown = 12;
      chip.setAttribute("aria-pressed", active.has(l.key));
      chip.style.color = active.has(l.key) ? l.colour : "";
      paintRows(wl.querySelector("#wlrows"));
    });
    fhost.append(chip);
  });

  paintRows(wl.querySelector("#wlrows"));
  wireSearch();
}

function paintRows(host){
  host.innerHTML = "";
  const ranked = COMPANIES
    .filter(c => c.gazette && active.has(c.lifecycle))
    .sort((a,b) => rank(b)-rank(a));

  if(!ranked.length){
    host.append(el(`<div class="nofilter">No companies in the selected groups.
      Turn one of the filters above back on.</div>`));
    return;
  }

  ranked.slice(0, shown).forEach(c => {
    const g = c.gazette, col = STAGE_COLOUR[g.stage] || "var(--risk-mid)";
    const life = lifeOf(c.lifecycle);
    const ladder = [1,2,3,4,5].map(i => `<i class="${i<=g.stage?"on":""}"></i>`).join("");
    const row = el(`
      <button class="wl-row">
        <div>
          <div class="wl-name">${esc(asFiled(c.name))}
            <span class="lifechip" style="color:${life.colour}">${life.label}</span></div>
          <div class="wl-meta">${esc(c.number)} · ${esc(c.sector||"?")} · ${esc(c.segment||"?")}</div>
        </div>
        <div>
          <div class="wl-why">${esc(prettyTier(g.severity_tier))} · ${g.notice_count} notice${g.notice_count===1?"":"s"}</div>
          <div class="ladder" style="--lad:${col}">${ladder}</div>
        </div>
        <div class="wl-right">
          <div class="wl-stage" style="color:${col}">${esc(g.stage_label)}</div>
          <div class="wl-when">last notice ${esc(fmtDate(g.latest_date))}</div>
        </div>
      </button>`);
    row.addEventListener("click", () => renderCompany(c));
    host.append(row);
  });

  if(shown < ranked.length){
    const more = el(`<button class="more">Show more · ${nf(ranked.length-shown)} remaining</button>`);
    more.addEventListener("click", () => { shown += 25; paintRows(host); });
    host.append(more);
  }
}

/* ==========================================================================
   Search. Stands in for Samuel's name plus postcode matcher.
   ========================================================================== */
function wireSearch(){
  const q = document.getElementById("q");
  const box = document.getElementById("cands");
  const close = () => { box.hidden = true; q.setAttribute("aria-expanded","false"); };

  q.addEventListener("input", () => {
    const raw = q.value.trim();
    if(raw.length < 2){ close(); return; }
    const v = raw.toLowerCase();
    const isNumber = /^[0-9A-Za-z]{6,8}$/.test(raw) && /\d/.test(raw);

    let hits;
    if(isNumber){
      const c = BY_NUMBER.get(raw.toUpperCase().padStart(8,"0"));
      hits = c ? [c] : [];
    } else {
      hits = [];
      for(const c of COMPANIES){
        if(c.name.toLowerCase().includes(v)){ hits.push(c); if(hits.length >= 40) break; }
      }
    }

    box.innerHTML = "";
    if(!hits.length){
      box.append(el(`<div class="cand-empty">
        <b>No company in the store matches that.</b><br>
        The store holds ${nf(COMPANIES.length)} of ${nf(META.universe)} companies:
        every one with a Gazette signal, plus a sample of those without.
        Try a company number, or pick one from the list below.</div>`));
    } else {
      hits.forEach(c => {
        // An exact company number is certain. A name match never is, which is
        // why the number is the join key everywhere else in the pipeline.
        const conf = isNumber ? 1.00 : 0.92;
        const life = lifeOf(c.lifecycle);
        const b = el(`
          <button class="cand" role="option">
            <span>${esc(asFiled(c.name))}</span>
            <span class="num">${esc(c.number)}</span>
            <span class="conf" style="color:${life.colour}">${life.label}</span>
            <span class="conf">${conf.toFixed(2)} match</span>
          </button>`);
        b.addEventListener("click", () => { close(); renderCompany(c); });
        box.append(b);
      });
    }
    box.hidden = false; q.setAttribute("aria-expanded","true");
  });

  q.addEventListener("keydown", e => { if(e.key === "Escape") close(); });
  document.addEventListener("click", e => { if(!e.target.closest(".searchbox")) close(); });
}

/* ==========================================================================
   Company page
   ========================================================================== */
function renderCompany(c){
  app.innerHTML = "";
  window.scrollTo({top:0});

  const back = el(`<button class="back">&larr; All companies</button>`);
  back.addEventListener("click", renderLanding);
  app.append(back);

  const life = lifeOf(c.lifecycle);
  app.append(el(`
    <section class="panel hero rise">
      <h1>${esc(asFiled(c.name))}</h1>
      <div class="facts">
        <b>${esc(c.number)}</b><span class="sep">·</span>
        <span class="lifechip" style="color:${life.colour}">${life.label}</span>
        <span class="sep">·</span><b>${esc(c.status||"?")}</b>
        ${c.incorporated ? `<span class="sep">·</span> Incorporated ${esc(fmtDate(c.incorporated))}` : ""}
      </div>
      ${c.address ? `<p class="addr">${esc(asFiled(c.address))}</p>` : ""}
      <div class="tagrow">
        ${c.sector ? `<span class="tag">${esc(c.sector)}</span>` : ""}
        ${c.segment ? `<span class="tag">${esc(c.segment)}</span>` : ""}
      </div>
    </section>`));

  const cols = el(`<div class="cols"></div>`);
  app.append(cols);
  cols.append(leftColumn(c));

  const right = el(`<div class="colstack rise" style="animation-delay:.12s"></div>`);
  cols.append(right);

  if(!c.timeline.length){ right.append(emptyPanel()); }
  else {
    right.append(timelinePanel(c));
    right.append(tiles(c));
    right.append(evidencePanel(c));
  }

  app.append(el(`<div class="foot">
    <span>Snapshot ${esc(fmtDate(META.snapshot_date))}</span>
    <span>Connected: ${LIVE.map(s => s.label).join(", ")}</span>
    <span>Prototype, not a live system</span>
  </div>`));
}

function leftColumn(c){
  const wrap = el(`<div class="colstack rise" style="animation-delay:.06s"></div>`);
  const g = c.gazette;

  if(g){
    const col = STAGE_COLOUR[g.stage] || "var(--risk-mid)";
    const ladder = [1,2,3,4,5].map(i => `<i class="${i<=g.stage?"on":""}"></i>`).join("");
    const flags = (g.flags || []).map(f =>
      `<span class="flagchip">${FLAG_LABEL[f] || f}</span>`).join("");

    wrap.append(el(`
      <section class="panel">
        <p class="eyebrow">Gazette assessment</p>
        <div class="stagehead">
          <b style="color:${col}">${esc(g.stage_label)}</b>
          <span>stage ${g.stage} of 5</span>
        </div>
        <div class="ladder" style="--lad:${col}">${ladder}</div>
        <div style="margin-top:16px">
          <div class="kv"><span>Severity</span><b>${esc(prettyTier(g.severity_tier))}</b></div>
          <div class="kv"><span>Notices</span><b class="mono">${g.notice_count} total · ${g.count_12m} in 12m</b></div>
          <div class="kv"><span>First notice</span><b class="mono">${esc(fmtDate(g.first_date))}</b></div>
          <div class="kv"><span>Last notice</span><b class="mono">${esc(fmtDate(g.latest_date))}</b></div>
          ${g.days_since !== null && g.days_since !== undefined
            ? `<div class="kv"><span>Days since</span><b class="mono">${g.days_since}</b></div>` : ""}
          <div class="kv"><span>Match</span><b class="mono">company number</b></div>
        </div>
        ${flags ? `<div class="flags">${flags}</div>` : ""}
        <p class="disclaimer">Read straight from Gazette notices. These are recorded
        facts with a date and a link, not a score or an opinion.</p>
      </section>`));
  }

  wrap.append(el(`
    <section class="panel pending">
      <p class="eyebrow">Model indices</p>
      <div class="kv"><span>Lending readiness, 3m</span><b>awaiting file</b></div>
      <div class="kv"><span>Insolvency, 6m</span><b>awaiting file</b></div>
      <div class="kv"><span>Voluntary exit, 6m</span><b>awaiting file</b></div>
      <div class="kv"><span>Growth, 12m</span><b>awaiting file</b></div>
      <p class="disclaimer">Fills in once the modelling branch saves its scored
      output. Composite indices, not predictions.</p>
    </section>`));

  return wrap;
}

function timelinePanel(c){
  const tl = el(`<section class="panel">
    <p class="eyebrow">Timeline · every source, one column</p>
    <div class="spine" id="spine"></div>
  </section>`);
  const spine = tl.querySelector("#spine");
  const src = SOURCES[0];
  c.timeline.forEach(ev => {
    const label = esc(ev.detail);
    spine.append(el(`
      <div class="ev" style="--src:${src.colour}">
        <span class="ev-date">${esc(fmtDate(ev.date))}</span>
        <span class="ev-src">${src.label}</span>
        <span class="ev-detail">${ev.id
          ? `<a href="${esc(STEM + ev.id)}" target="_blank" rel="noopener">${label}</a>` : label}</span>
      </div>`));
  });
  return tl;
}

function tiles(c){
  const host = el(`<div class="tiles"></div>`);
  SOURCES.forEach(s => {
    if(s.key === "gazette"){
      const g = c.gazette;
      host.append(el(`
        <div class="tile ${g ? "on" : "off"}">
          <div class="tile-name">${s.label}</div>
          <div class="tile-val">${g ? `${g.notice_count} notice${g.notice_count===1?"":"s"}` : "checked, nothing found"}</div>
          ${g ? `<div class="tile-sub">most recent ${esc(fmtDate(g.latest_date))}</div>` : ""}
        </div>`));
    } else {
      host.append(el(`
        <div class="tile wait">
          <div class="tile-name">${s.label}</div>
          <div class="tile-val">not connected yet</div>
        </div>`));
    }
  });
  return host;
}

function evidencePanel(c){
  const links = c.timeline.filter(e => e.id);
  const panel = el(`<section class="panel">
    <p class="eyebrow">Evidence</p><div class="ev-links" id="evl"></div>
  </section>`);
  const evl = panel.querySelector("#evl");
  if(!links.length){
    evl.append(el(`<p style="margin:0;color:var(--text-dim);font-size:13px">
      No linkable evidence for this company.</p>`));
  }
  links.forEach(e => {
    evl.append(el(`<a class="ev-link" href="${esc(STEM + e.id)}" target="_blank" rel="noopener">
      Gazette notice <span class="k">${esc(e.id)}</span>
      <span class="conf-chip">certain match</span></a>`));
  });
  return panel;
}

function emptyPanel(){
  // A tick means we looked. Sources with no adapter yet get a dash, because
  // claiming we checked them would not be true.
  const rows = SOURCES.map(s => `
    <div>
      <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        ${s.live ? '<path d="m5 13 4 4L19 7"/>' : '<path d="M6 12h12"/>'}</svg>
      ${s.label}<span>${s.live ? "checked, nothing found" : "not connected yet"}</span>
    </div>`).join("");
  return el(`
    <section class="panel nothing">
      <img class="nothing-horse" src="assets/horse-mark.png" alt="" aria-hidden="true" onerror="this.remove()">
      <h2>Nothing found for this company.</h2>
      <p>This is a result, not an error. Only ${nf(META.companies_with_signal)} of the
      ${nf(META.universe)} companies we hold carry a Gazette signal at all.
      For a company the model has flagged, an absence of distress notices is itself
      worth knowing.</p>
      <div class="checked">${rows}</div>
    </section>`);
}

/* ========================================================================== */
if(!COMPANIES.length){
  app.innerHTML = `<section class="panel"><p class="eyebrow">Store missing</p>
    <p style="margin:0">No <code>data.js</code> next to this page. Build it with
    <code>python dashboard/build_data.py</code>, then reload.</p></section>`;
} else {
  renderLanding();
}
</script>
