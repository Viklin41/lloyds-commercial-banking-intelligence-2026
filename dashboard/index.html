<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Companies House Data Store · Lloyds Commercial Banking</title>
<!-- Inline, so the browser's automatic /favicon.ico request never fires and no longer
     logs a 404 on every page load. A data URI needs no file and no round trip. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23044D3E'/><text x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%2300C48C' text-anchor='middle'>C</text></svg>" />
<style>
/* ==========================================================================
   Fonts.

   Self-hosted, not linked from Google Fonts. The dashboard makes no network
   requests at all, and a demo that loses its typography when the room's wifi
   drops is not a demo worth giving. Two subsets: latin, plus latin-ext so an
   accented company name in a heading does not fall back mid-word.

   Fraunces is a variable font with four axes. `opsz` is left to the browser via
   font-optical-sizing, so a 42px page title gets finer, sharper detail than a
   16px panel heading automatically. SOFT and WONK are set per-use below.

   Fraunces is licensed under the SIL Open Font License 1.1; the licence travels
   with the files in assets/Fraunces-OFL.txt.
   ========================================================================== */
@font-face{
  font-family:"Fraunces";
  font-style:normal;
  font-weight:300 700;
  font-display:swap;
  src:url("assets/fraunces-latin.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,
    U+FEFF,U+FFFD;
}
@font-face{
  font-family:"Fraunces";
  font-style:normal;
  font-weight:300 700;
  font-display:swap;
  src:url("assets/fraunces-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,
    U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,
    U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}

/* ==========================================================================
   Tokens
   ========================================================================== */
:root{
  /* Lloyds greens. Approximate, confirm against brand guidelines before use. */
  --green-brand:  #006A4D;
  --green-deep:   #053D2C;
  --green-deeper: #01251A;
  /* The page field. Near-black with a green cast, so green reads as the accent. */
  --ink:          #050908;
  --ink-raise:    #0A100D;
  --jade:         #00C48C;
  --mint:         #7FE7C4;

  --risk-high:  #E0574C;
  --risk-mid:   #E9A23B;
  --positive:   #56D9A6;

  /* Lifecycle */
  --life-trading:    #56D9A6;
  --life-fading:     #E9A23B;
  --life-distressed: #F0784A;
  --life-insolvent:  #E0574C;

  /* Kept as aliases so a handful of older rules keep working, but they now
     point at the Liquid Glass tokens below. One source of truth. */
  --glass:        var(--lg-tint);
  --glass-strong: var(--lg-tint-strong);
  --edge:         var(--lg-rim);
  --edge-bright:  var(--lg-rim-bright);

  --text:      #EAF3EF;
  --text-dim:  #A7BDB5;
  /* Lifted from #6E8781. The glass panes sit lighter than the flat panels they
     replaced, and at the old value eyebrows and placeholders measured 2.3 to
     2.7 against them, below the 3.0 floor for large text. */
  --text-faint:#8CA79F;

  --font-ui: "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  /* Headings. Lloyds' own headline face is GT Ultra Lloyds, a custom cut of Grilli
     Type's GT Ultra that the bank licenses and does not distribute, so it cannot be
     used here. Fraunces stands in: it is the closest open-licensed face to what
     GT Ultra does, which its designers describe as dancing "between the worlds of
     sans and serifs, fusing calligraphy and construction". Tuned below to lean on
     the calligraphic side and none of the playful side. If the brand team ever
     supplies the real webfonts, only this line and the @font-face block change. */
  --font-display: "Fraunces","Segoe UI Variable Display","Segoe UI",Georgia,serif;
  /* The neutral face. Two jobs: every figure, because a display serif on
     "1,531,094" turns a number you read into a number you decipher; and every
     heading below page level, because Fraunces is reserved for the three titles
     that name where you are. */
  --font-neutral: "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-mono: "Cascadia Mono",Consolas,ui-monospace,"SF Mono",monospace;

  --r: 14px;

  /* ---- Liquid Glass -----------------------------------------------------
     Four properties drive the material: tint, rim, sheen and depth. Every
     glass surface reads from these, so the whole system retunes from here. */
  --lg-tint:        rgba(255,255,255,.075);
  --lg-tint-strong: rgba(255,255,255,.12);
  --lg-rim:         rgba(255,255,255,.16);
  --lg-rim-bright:  rgba(255,255,255,.28);

  /* Specular: a light source off the top-left, the way a pane catches a
     window. Two stops, because one reads as a flat wash. */
  --lg-spec-hot:  rgba(255,255,255,.17);
  --lg-spec-warm: rgba(255,255,255,.045);

  /* Material thickness. Thicker glass blurs more, sits higher, casts further. */
  --lg-blur-sm: 9px;
  --lg-blur-md: 15px;
  --lg-blur-lg: 24px;
  --lg-sat: 1.55;

  --lg-depth-sm: 0 3px 12px rgba(0,0,0,.18);
  --lg-depth-md: 0 10px 32px rgba(0,0,0,.28);
  --lg-depth-lg: 0 20px 56px rgba(0,0,0,.40);

  /* Inner bevel: light catches the top-left edge, the bottom-right falls away. */
  --lg-bevel-sm: inset 1px 1px 0 rgba(255,255,255,.16), inset -1px -1px 0 rgba(0,0,0,.14);
  --lg-bevel-md: inset 1px 1px 0 rgba(255,255,255,.22), inset -1px -1px 0 rgba(0,0,0,.20);
  --lg-bevel-lg: inset 1px 1px 0 rgba(255,255,255,.26), inset -1.5px -1.5px 0 rgba(0,0,0,.26);

  /* Refraction slot, filled in by the capability probe below. The default has
     to be a VALID no-op filter function, not `none`: a filter list containing
     `none` is invalid, which silently drops the whole backdrop-filter and
     takes the blur with it. opacity(1) changes nothing and keeps it parsing. */
  --lg-refract: opacity(1);

  /* ---- The card ---------------------------------------------------------
     One surface for every card-shaped thing on the dashboard: the analytics
     charts, the profile panels, the KPI faces, the source tiles, the result
     rows, the empty states. Glass stays the material; these set the geometry,
     the ambient light and the response to a pointer, so the whole set retunes
     from here rather than from a dozen component rules that had drifted apart. */
  --card-r:    16px;
  --card-r-sm: 13px;          /* small cards: 16px on a 90px tile reads as a pill */
  --card-r-in: 11px;          /* a box nested inside a card, always one step tighter */
  --card-tint: rgba(9,14,12,.72);
  --card-hot:  rgba(0,196,140,.30);
  --card-glow: rgba(0,196,140,.13);
  --card-cast: 0 16px 44px rgba(0,0,0,.42);
  --card-lift: translateY(-2px);

  /* ---- Liquid Glass: the control system ---------------------------------
     The --lg-* tokens above describe the MATERIAL (how thick the glass is,
     how it blurs, how it catches light). These describe the HIERARCHY: how
     much of that material each kind of thing on the page is allowed.

     Three tiers, and the third one is a deliberate absence:

       1  navigation      the one surface that floats above the document
       2  controls        toggles, buttons, chips, drawers, info affordances
       -  cards & charts  NOT glass. They keep THE CARD block, because a page
                          where everything is glass has no hierarchy at all,
                          and the charts already carry their own dark surface.

     Everything below reads from these, so the whole language retunes here
     rather than in twenty component rules. */
  --glass-1-tint:  rgba(255,255,255,.055);   /* nav: most elevated */
  --glass-1-rim:   rgba(255,255,255,.22);
  --glass-2-tint:  rgba(255,255,255,.038);   /* controls */
  --glass-2-rim:   rgba(255,255,255,.15);

  --glass-hover-tint: rgba(255,255,255,.085);
  --glass-hover-rim:  rgba(255,255,255,.30);

  /* Selection is green, because selection has always been green here. The
     glass language does not get to introduce a second accent. */
  --glass-on-tint: rgba(0,196,140,.15);
  --glass-on-rim:  rgba(127,231,196,.48);

  /* The internal highlight: a hard band along the top edge, which is what a
     bevel does to a light source directly above it. Kept to the top 40% so it
     never sits behind the middle of a label. */
  --glass-sheen:   linear-gradient(to bottom, rgba(255,255,255,.13) 0%, transparent 42%);
  --glass-bevel-1: inset 0 1px 0 rgba(255,255,255,.26), inset 0 -1px 0 rgba(0,0,0,.24);
  --glass-bevel-2: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.18);
  --glass-cast-1:  0 8px 26px rgba(0,0,0,.34);
  --glass-cast-2:  0 3px 12px rgba(0,0,0,.22);

  /* Fast and flat. No overshoot: a control that bounces reads as a toy. */
  --glass-ease: .17s cubic-bezier(.4,0,.2,1);
}

/* Fraunces axis settings, applied wherever --font-display is. WONK is the axis
   that swaps in the playful alternate letterforms; a bank's headline face wants
   none of them, so it stays at 0. SOFT rounds the terminals, which is the
   calligraphic half of what GT Ultra does. `opsz` is deliberately not pinned:
   font-optical-sizing lets a 42px page title carry finer, sharper detail than a
   16px panel heading without either being hand-tuned.

   Tracking is reset here too. The negative letter-spacing on these headings was
   dialled in against Segoe UI Variable Display, which sets much tighter than
   Fraunces; carried over unchanged it closed the counters up. */
.lede,.mkt-head h1,.hero h1{
  font-variation-settings:"SOFT" 32,"WONK" 0;
  font-optical-sizing:auto;
  letter-spacing:-.008em;
}

*{box-sizing:border-box}
body{
  margin:0;font-family:var(--font-ui);font-size:14px;line-height:1.5;
  color:var(--text);background:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}

/* The field is near-black so the green can be the accent rather than the environment.
   It was a saturated green gradient, which meant every green highlight had to compete
   with the background for the same colour. What is left of the green here is three low
   glows at the corners: enough to keep the brand present, not enough to tint the cards. */
.bg{position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(1000px 700px at 6% -12%, rgba(0,196,140,.14), transparent 58%),
    radial-gradient(820px 820px at 96% 2%, rgba(0,138,101,.11), transparent 60%),
    radial-gradient(760px 560px at 48% 118%, rgba(0,196,140,.07), transparent 64%),
    linear-gradient(168deg, #08120E 0%, #060D0A 42%, #040907 78%, #030605 100%);
}
/* Lower against the darker field: at .13 the silhouette read as a shape behind the
   cards rather than a watermark under them. */
.bg-horse{position:fixed;right:-7vw;bottom:-14vh;z-index:-1;
  width:min(42vw,560px);height:auto;opacity:.055;pointer-events:none;
  filter:drop-shadow(0 0 70px rgba(0,0,0,.45));}

/* ==========================================================================
   Chrome
   ========================================================================== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:12px 24px;border-bottom:1px solid var(--lg-rim)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--jade) 18%,var(--mint) 50%,var(--jade) 82%,transparent);
  opacity:.5}
/* The official mark is black, the bar is dark green. A white chip keeps the
   asset unmodified and still legible. */
.markwrap{display:flex;align-items:center;justify-content:center;flex:none;
  background:#fff;border-radius:10px;padding:7px 12px;height:52px;
  box-shadow:0 2px 12px rgba(0,0,0,.28)}
/* The supplied asset is the full lockup, so it gets room to stay legible and
   is never cropped. The inline fallback has no intrinsic size, so it needs an
   explicit width. */
.mark{height:38px;max-width:150px;width:auto;color:#0B0B0B;display:block}
.markwrap > svg.mark{width:34px}
.divider{width:1px;height:28px;background:var(--edge);flex:none}
.wordmark{font-family:var(--font-neutral);font-weight:600;letter-spacing:-.01em;font-size:15px}
.wordmark span{display:block;font-family:var(--font-ui);font-weight:400;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-top:1px}
/* Top navigation. Two destinations, so it is two links and not a menu. */
/* .topnav layout and surface live in the Liquid Glass block near the end. */
.topnav button{font:inherit;font-size:13px;padding:7px 15px;border-radius:99px;cursor:pointer;
  background:transparent;border:1px solid transparent;color:var(--text-dim);
  display:flex;align-items:center;gap:8px;transition:color .16s,background .16s,border-color .16s}
.topnav button:hover{color:var(--text)}
.topnav button[aria-current="page"]{color:var(--text);background:rgba(0,196,140,.13);
  border-color:rgba(0,196,140,.42)}
.topnav .nd{width:5px;height:5px;border-radius:99px;background:currentColor;opacity:.55}
.topnav button[aria-current="page"] .nd{background:var(--jade);opacity:1}
/* The bar was already tight before the nav was added; with it, the snapshot chip ran off
   the right edge on a phone and took the whole document into a horizontal scroll. Let it
   wrap instead of overflow. Styling is unchanged, only the wrapping. */
@media (max-width:760px){
  .topbar{flex-wrap:wrap;row-gap:10px;padding:10px 16px}
  .topnav{margin-left:auto}
  .snapshot{margin-left:0;order:3}
}

.snapshot{margin-left:auto;display:flex;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);
  padding:6px 12px;border:1px solid var(--edge);border-radius:99px;background:var(--glass)}
.snapshot b{color:var(--mint);font-weight:600}
.dot{width:6px;height:6px;border-radius:99px;background:var(--jade);flex:none}

.wrap{max-width:1180px;margin:0 auto;padding:34px 24px 90px}

/* ==========================================================================
   Landing
   ========================================================================== */
.lede{font-family:var(--font-display);font-size:clamp(28px,4.4vw,42px);font-weight:600;
  letter-spacing:-.03em;line-height:1.08;margin:8px 0 8px}
.sub{color:var(--text-dim);max-width:60ch;margin:0 0 24px;font-size:15px}
.sub small{display:block;font-size:12.5px;color:var(--text-faint);margin-top:6px}

.searchbox{position:relative;max-width:560px}
.searchbox input{width:100%;padding:15px 17px 15px 46px;position:relative;z-index:1;
  font-family:var(--font-ui);font-size:15px;color:var(--text);
  border-radius:12px;outline:none;
  transition:border-color .18s, box-shadow .18s}
.searchbox input::placeholder{color:var(--text-faint)}
.searchbox input:focus{border-color:var(--jade);box-shadow:0 0 0 4px rgba(0,196,140,.18)}
.searchbox > svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:2;
  width:17px;height:17px;color:var(--text-faint);pointer-events:none}

.candidates{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:30;
  max-height:340px;overflow:auto;border-radius:12px}
.candidates[hidden]{display:none}
.cand{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 15px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.05);
  color:var(--text);font-family:var(--font-ui);font-size:13.5px;cursor:pointer}
.cand:last-child{border-bottom:0}
.cand:hover,.cand:focus-visible{background:rgba(0,196,140,.15);outline:none}
.cand .num{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)}
.cand .conf{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);white-space:nowrap}
.cand-empty{padding:16px 15px;color:var(--text-dim);font-size:13.5px;line-height:1.55}
.cand-empty b{color:var(--text);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:30px 0 0}
.stat{padding:16px 18px;border-radius:12px}
.stat b{display:block;font-family:var(--font-neutral);font-size:23px;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--text-dim);display:block;margin-top:3px}

/* ==========================================================================
   Shared
   ========================================================================== */
/* Surface and light come from THE CARD block at the end of this stylesheet. */
.panel{padding:19px 22px 18px}

/* The panel header. Same parts as `.ma-head`, one size down: the profile stacks many
   more panels than the analytics page, so its chrome is lighter. */
.phead{display:flex;align-items:center;gap:11px;padding-bottom:12px;margin-bottom:15px;
  border-bottom:1px solid var(--edge)}
.phead .ma-ico{width:30px;height:30px;border-radius:8px}
.phead .ma-ico svg{width:15px;height:15px}
.phead .eyebrow{margin:0;flex:1;min-width:0}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-faint);margin:0 0 14px;font-weight:600}
.lifechip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;
  border:1px solid currentColor;white-space:nowrap}

/* ==========================================================================
   Watchlist
   ========================================================================== */
.watchlist{margin-top:44px}
.wl-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.wl-head h2{font-family:var(--font-neutral);font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.wl-head p{margin:0;color:var(--text-faint);font-size:12.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;
  background:var(--glass);border:1px solid var(--edge);color:var(--text-dim);
  font-family:var(--font-ui);font-size:12.5px;cursor:pointer;transition:all .16s}
.fchip .n{font-family:var(--font-mono);font-size:11px;opacity:.8}
.fchip .swatch{width:8px;height:8px;border-radius:99px;background:currentColor}
.fchip:hover{border-color:var(--edge-bright)}
.fchip[aria-pressed="true"]{color:var(--text);background:var(--glass-strong);
  border-color:currentColor}
.fchip:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

.wl-row{display:grid;grid-template-columns:1fr 200px 158px;gap:18px;align-items:center;
  width:100%;text-align:left;padding:15px 20px;margin-bottom:8px;cursor:pointer;
  border-radius:12px;color:var(--text);
  font-family:var(--font-ui);font-size:14px;
  transition:border-color .18s, transform .18s, background-color .18s}
.wl-row:hover,.wl-row:focus-visible{border-color:rgba(0,196,140,.55);
  background:var(--glass-strong);transform:translateX(3px);outline:none}
.wl-name{font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wl-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);margin-top:4px}
.wl-why{font-size:12.5px;color:var(--text-dim)}
.wl-right{text-align:right}
.wl-stage{font-family:var(--font-neutral);font-size:13px;font-weight:600;letter-spacing:-.01em}
.wl-when{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:3px}
.more{display:block;width:100%;margin-top:6px;padding:12px;border-radius:12px;
  background:none;border:1px dashed var(--edge);color:var(--text-dim);
  font-family:var(--font-ui);font-size:13px;cursor:pointer}
.more:hover,.more:focus-visible{border-color:var(--jade);color:var(--mint);outline:none}
.nofilter{padding:22px;border:1px dashed var(--edge);border-radius:12px;color:var(--text-dim);font-size:13.5px}

.ladder{display:flex;gap:3px;margin-top:8px}
.ladder i{flex:1;height:5px;border-radius:2px;background:rgba(255,255,255,.10)}
.ladder i.on{background:var(--lad)}

/* ==========================================================================
   Company page
   ========================================================================== */
.back{display:inline-flex;align-items:center;gap:7px;margin-bottom:20px;
  background:none;border:0;color:var(--text-dim);font-family:var(--font-ui);
  font-size:13px;cursor:pointer;padding:6px 2px}
.back:hover,.back:focus-visible{color:var(--mint);outline:none}

.hero{position:relative;overflow:hidden;padding:28px 30px}
.hero h1{font-family:var(--font-display);font-size:clamp(22px,3.2vw,31px);font-weight:600;
  letter-spacing:-.025em;margin:0 0 10px;line-height:1.12;max-width:26ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;
  font-family:var(--font-mono);font-size:12px;color:var(--text-dim)}
.facts b{color:var(--text);font-weight:500}
.facts .sep{color:var(--text-faint)}
.addr{margin:12px 0 0;color:var(--text-dim);font-size:12.5px;letter-spacing:.02em}
.tagrow{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:4px 11px;border-radius:99px;
  background:rgba(255,255,255,.07);border:1px solid var(--edge);color:var(--text-dim)}
/* News pill. Three states rather than two: "we looked and found nothing" and "we
   never looked" are different claims, and only 96 companies were searched. The
   unsearched state is deliberately the quietest of the three. */
.tag.news-yes{background:rgba(143,184,255,.16);border-color:rgba(143,184,255,.5);color:#BBD3FF}
.tag.news-no{background:rgba(255,255,255,.05)}
.tag.news-unknown{border-style:dashed;opacity:.62}
.tag.lbg-former{background:rgba(233,162,59,.16);border-color:rgba(233,162,59,.55);color:#F0C078}

/* Model scores. The horizon sits with the number by design, never apart from it. */
.scorerow{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.scorerow:last-of-type{border-bottom:0}
/* Stacked rather than side by side. In the 330px column "Voluntary exit" and its
   window competed for the same line and both wrapped mid-phrase. */
.scorehead b{display:block;font-size:13.5px;font-weight:600}
.horizon{display:block;font-family:var(--font-mono);font-size:10.5px;
  color:var(--text-faint);margin-top:2px}
.scoreband{display:flex;align-items:center;gap:9px;margin-top:7px}
.bandchip{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;
  background:rgba(0,196,140,.14);border:1px solid rgba(0,196,140,.4);color:#7FE7C4}
.scorerow.unranked .bandchip{background:rgba(255,255,255,.06);
  border-color:var(--edge);color:var(--text-dim)}
.rawscore{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint)}
.scorenote{margin:6px 0 0;font-size:11.5px;color:var(--text-dim);line-height:1.45}
.notscored{margin:0 0 10px;font-size:13.5px;color:var(--text)}
.lbgline{margin:0 0 12px;font-size:12.5px;color:var(--text-dim);line-height:1.5}
.panel.lbgformer{border-color:rgba(233,162,59,.34)}

/* ---- Global filter panel ------------------------------------------------
   Sneha's note was that it wasn't obvious the old chips were a filter area at
   all, so this is deliberately framed: a titled box, a visible count, and a
   clear-all. Nothing about it should need explaining. */
.fbody{padding:6px 16px 14px}
.fgroup{border-bottom:1px solid rgba(255,255,255,.06)}
.fgroup:last-child{border-bottom:0}
.fgroup > summary{cursor:pointer;list-style:none;padding:11px 0;font-size:12.5px;
  font-weight:600;color:var(--text-dim);display:flex;align-items:center;gap:9px}
.fgroup > summary::-webkit-details-marker{display:none}
.fgroup > summary::before{content:"›";display:inline-block;transition:transform .15s;
  color:var(--text-faint);font-size:15px}
.fgroup[open] > summary::before{transform:rotate(90deg)}
.fgroup > summary .on{font-family:var(--font-mono);font-size:10.5px;color:var(--jade)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));
  gap:12px;padding:2px 0 14px 18px}
.fitem label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:5px;font-weight:600}
.fitem select,.fitem input{width:100%;font:inherit;font-size:12.5px;padding:7px 9px;
  border-radius:8px;background:rgba(0,0,0,.22);border:1px solid var(--edge);color:var(--text)}
.fitem select[multiple]{height:96px}
.fitem select:focus,.fitem input:focus{outline:none;border-color:var(--jade)}
.fitem .pair{display:flex;gap:7px}
.fitem .zero{color:var(--text-faint)}

/* Presets. These are the approved combinations; each carries its live population. */
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.pchip{font:inherit;font-size:12px;padding:7px 13px;border-radius:99px;cursor:pointer;
  background:var(--glass);border:1px solid var(--edge);color:var(--text-dim);text-align:left}
.pchip:hover{border-color:var(--jade);color:var(--text)}
.pchip[aria-pressed="true"]{border-color:var(--jade);background:rgba(0,196,140,.13);
  color:var(--text)}
.pchip .n{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-left:6px}

/* ---- Focus one chip, let the rest recede --------------------------------
   Nine presets is enough that the eye needs help landing on one. Hovering any
   chip brings it forward and pushes its siblings back, so the row reads as a
   set of alternatives you are choosing between rather than nine equal things.

   The reference version of this pushes siblings back with filter:blur(10px).
   That is not used here, for two reasons. Every chip carries a population count
   you may well be comparing (31,002 against 8,992 against 2,303), and blurring
   eight of the nine hides exactly the numbers the row exists to show. And blur
   forces a repaint of every sibling on every hover, where opacity and a small
   transform stay on the compositor.

   So recession is opacity plus a slight desaturation and shrink. The eye still
   goes where it should; nothing becomes unreadable on the way. The selected
   chip is deliberately exempt: it must stay legible while you look at others,
   because it is the answer to "what is applied right now". */
.presets .pchip{
  transition:opacity .28s cubic-bezier(.4,0,.2,1),
             transform .28s cubic-bezier(.4,0,.2,1),
             filter .28s cubic-bezier(.4,0,.2,1),
             border-color .18s, color .18s, background-color .18s;
}
.presets:hover .pchip:not(:hover):not([aria-pressed="true"]){
  opacity:.5;
  filter:saturate(.55);
  transform:scale(.97);
}
.presets .pchip:hover{
  transform:scale(1.04);
  border-color:var(--jade);
  color:var(--text);
  z-index:1;
}
/* Keyboard parity: tabbing through the row should focus the same way a pointer
   does, or the effect silently excludes anyone not using a mouse. */
.presets:focus-within .pchip:not(:focus-visible):not([aria-pressed="true"]){
  opacity:.5;
  filter:saturate(.55);
  transform:scale(.97);
}
.presets .pchip:focus-visible{transform:scale(1.04)}

@media (prefers-reduced-motion:reduce){
  .presets .pchip{transition:opacity .28s linear, border-color .18s, color .18s}
  .presets:hover .pchip:not(:hover):not([aria-pressed="true"]),
  .presets:focus-within .pchip:not(:focus-visible):not([aria-pressed="true"]){
    transform:none;filter:none;opacity:.55;
  }
  .presets .pchip:hover,.presets .pchip:focus-visible{transform:none}
}

/* Zero-result state names the filter that emptied the list, rather than looking broken. */
.zerostate{padding:22px;border:1px dashed var(--edge);border-radius:12px;
  color:var(--text-dim);font-size:13.5px;line-height:1.6}
.zerostate b{color:var(--text)}
.zerostate button{font:inherit;font-size:12.5px;margin-top:12px;padding:7px 13px;
  border-radius:99px;cursor:pointer;background:transparent;border:1px solid var(--jade);
  color:var(--text)}

/* ---- Views, Tools, Result ------------------------------------------------
   Three decisions, three different shapes, so the role of each is readable
   before its label is. A view is one-of-three, so it gets a segmented track.
   A tool opens, so it gets a disclosure. The result is an outcome, not an
   input, so it gets no chrome at all. The old layout made views and presets
   two identical pill rows, which is what made the page read as one slab. */
.section-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--text-faint);margin:0 0 8px}
.section-label:not(:first-child){margin-top:22px}

/* Views: one track, one selected. Mutually exclusive, and shaped like it.
   The selection is a single element that slides between the options rather than
   a highlight that blinks from one to the next, so the eye follows the move and
   the track reads as one control with a position, not three separate buttons. */
.vseg{position:relative;display:inline-flex;gap:3px;padding:3px;border-radius:13px;flex-wrap:wrap;
  background:rgba(0,0,0,.24);border:1px solid var(--edge)}
.vseg .thumb{position:absolute;left:0;top:0;border-radius:10px;pointer-events:none;
  background:rgba(0,196,140,.13);border:1px solid rgba(0,196,140,.42);
  transition:transform .34s cubic-bezier(.32,.72,0,1),width .34s cubic-bezier(.32,.72,0,1),
             height .34s cubic-bezier(.32,.72,0,1)}
.vseg button{position:relative;z-index:1;font:inherit;font-size:12.5px;padding:8px 16px;
  border-radius:10px;cursor:pointer;background:transparent;border:1px solid transparent;
  color:var(--text-dim);text-align:left;display:flex;flex-direction:column;gap:2px;
  transition:color .2s}
.vseg button:hover{color:var(--text)}
.vseg button[aria-pressed="true"]{color:var(--text)}
.vseg button .n{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
  transition:color .2s}
.vseg button[aria-pressed="true"] .n{color:var(--mint)}

/* Tools: two drawers, both shut on arrival. Whatever is switched on inside
   stays legible on the closed button, because a collapsed panel must never
   be the only place a live setting is visible. */
.tools{display:flex;flex-direction:column;gap:10px}
.toolbtn{font:inherit;font-size:13px;width:100%;padding:12px 16px;border-radius:13px;
  cursor:pointer;background:var(--glass);border:1px solid var(--edge);color:var(--text);
  display:flex;align-items:center;gap:11px;text-align:left;
  transition:border-color .16s,background .16s}
.toolbtn:hover{border-color:rgba(0,196,140,.4)}
.toolbtn[aria-expanded="true"]{border-color:rgba(0,196,140,.4);border-bottom-left-radius:0;
  border-bottom-right-radius:0}
.toolbtn .tlabel{flex:1}
.toolbtn .chev{color:var(--text-faint);font-size:15px;line-height:1;
  transition:transform .28s cubic-bezier(.4,0,.2,1)}
.toolbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.toolbtn .on{font-family:var(--font-mono);font-size:10.5px;padding:2px 8px;border-radius:99px;
  background:rgba(0,196,140,.15);border:1px solid rgba(0,196,140,.4);color:var(--mint)}

/* The drawer animates on grid-template-rows, so it slides to its natural height
   with no measuring and no fixed max-height to get wrong.

   The visible box lives on .dcard, INSIDE the clipper, and is never gated on
   [data-open]. It was gated before, which meant that on close the border and
   background disappeared on the first frame while only the height animated:
   the open read as a reveal and the close read as a snap. Clipping the card
   instead makes both directions the same movement, played in reverse. */
.drawer{display:grid;grid-template-rows:0fr;opacity:0;
  transition:grid-template-rows .28s cubic-bezier(.4,0,.2,1),opacity .22s ease}
.drawer[data-open]{grid-template-rows:1fr;opacity:1}
.drawer > .clip{overflow:hidden;min-height:0}
.drawer .dcard{border:1px solid rgba(0,196,140,.4);border-top:0;
  border-radius:0 0 13px 13px;background:var(--glass)}
.drawer .presets{margin:0;padding:14px 16px}
.drawer .fbody{padding:2px 16px 10px}
/* The only text on the dashboard running an uncomfortable measure: at the drawer's
   full width this sentence set 191 characters to the line, roughly two and a half
   times the point where the eye starts losing its place on the return sweep. Capped.
   This is a paragraph of explanation, not one of the single-sentence section ledes,
   which are deliberately left uncapped so they hold one line. */
.drawer .drawer-note{margin:0;padding:13px 16px 0;font-size:12px;color:var(--text-faint);
  line-height:1.5;max-width:96ch}

/* The active preset, stated outside the drawer so closing it hides nothing. */
.activepreset{display:flex;align-items:flex-start;gap:14px;margin-top:12px;padding:13px 16px;
  border-radius:13px;background:rgba(0,196,140,.07);border:1px solid rgba(0,196,140,.34)}
.activepreset .ap-body{flex:1;min-width:0}
.activepreset .ap-top{font-size:13px;font-weight:600;color:var(--text)}
.activepreset .ap-top .n{font-family:var(--font-mono);font-size:11px;color:var(--mint);
  font-weight:400;margin-left:8px}
.activepreset .ap-note{margin:4px 0 0;font-size:12px;color:var(--text-dim);line-height:1.5}
/* Adjusted: the same bar in a different key, so a changed preset never passes for the
   approved one at a glance. */
.activepreset.adjusted{background:rgba(233,162,59,.07);border-color:rgba(233,162,59,.4)}
.activepreset .ap-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--life-fading);border:1px solid rgba(233,162,59,.5);
  border-radius:99px;padding:2px 8px;margin-left:9px;font-weight:400}
.activepreset .ap-conds{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
/* Fixed conditions read as stated facts, not as controls that failed to open. */
.matchchip.fixed{color:var(--text-dim);border-style:dashed}
.activepreset .ap-hint{margin:10px 0 0;font-size:11.5px;color:var(--text-faint);line-height:1.5}
.activepreset .ap-hint b{color:var(--text-dim)}
.activepreset button{font:inherit;font-size:11.5px;padding:5px 12px;border-radius:99px;
  cursor:pointer;background:transparent;border:1px solid var(--edge);color:var(--text-dim);
  flex:none}
.activepreset button:hover{border-color:var(--risk-high);color:var(--text)}

/* Company profile additions. The SIC line sits under the address because both answer
   "who is this", and the match bar sits above the assessment because it answers
   "why am I looking at it" before anything is assessed. */
.sic{margin:8px 0 0;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
  line-height:1.5}
.matchbar{margin:16px 0 0;padding:14px 18px;border-radius:16px;background:var(--glass);
  border:1px solid var(--edge)}
/* The strip takes the header's icon but not its rule: it holds one row of chips, and a
   divider here would give a provenance note the weight of a panel. */
.matchbar .phead{padding-bottom:0;margin-bottom:11px;border-bottom:0}
.matchbar .phead .ma-ico{width:24px;height:24px;border-radius:7px}
.matchbar .phead .ma-ico svg{width:13px;height:13px}
.matchbar .eyebrow{margin:0 0 10px}
.matchrow{display:flex;flex-wrap:wrap;gap:8px}
.matchchip{font-size:12px;padding:5px 11px;border-radius:99px;background:rgba(0,0,0,.22);
  border:1px solid var(--edge);color:var(--text);display:inline-flex;gap:7px;align-items:baseline}
.matchchip > span{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-faint)}
.matchchip.view{border-color:rgba(255,255,255,.16)}
.matchchip.preset{border-color:rgba(0,196,140,.42);background:rgba(0,196,140,.11)}
.matchnote{margin:10px 0 0;font-size:12px;color:var(--text-dim);line-height:1.5}
.lbgline.warn{color:var(--life-fading)}
.ev-extra{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
  margin-top:2px}

/* ---- Market Analytics ----------------------------------------------------
   A report page, so it borrows the panel material and the type scale and adds
   only what a chart genuinely needs: a bar, a column, a grid cell and a line.
   No charting library; these are divs and one small SVG. */
.mkt-head{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;margin:6px 0 26px}
.mkt-head h1{font-family:var(--font-display);font-size:clamp(23px,3vw,32px);font-weight:600;
  letter-spacing:-.02em;margin:0}
/* One sentence, and it should stay on one line while the window has room for it.
   The old 72ch cap broke it across three lines on a desktop that had space for one. */
.mkt-head p{margin:8px 0 0;color:var(--text-dim);font-size:13.5px;line-height:1.6}
.mkt-head .htext{flex:1;min-width:280px}
/* A label, not a control: there is one snapshot, so there is nothing to switch between. */
.mkt-chip{margin-left:auto;flex:none;font-family:var(--font-mono);font-size:11px;
  color:var(--text-dim);padding:7px 13px;border-radius:99px;border:1px solid var(--edge);
  background:var(--glass);white-space:nowrap}
.mkt-chip b{color:var(--mint);font-weight:600}

/* ---- Hero band -----------------------------------------------------------
   The headline metric on the left, the shape of the whole market on the right,
   with the top-four threshold marked on it. One band carries the league table
   and the concentration finding at a glance; both keep their full charts below. */
.hero-band{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.85fr);
  gap:26px;align-items:stretch;border:1px solid var(--edge);border-radius:var(--r);
  background:var(--glass);padding:22px 24px;margin-bottom:14px}
/* Two minmax columns hold a 560px floor between them, which pushed the whole document
   into a horizontal scroll on a phone. Below this the band sits under the metric. */
@media (max-width:880px){
  .hero-band{grid-template-columns:1fr;gap:22px;padding:20px}
  .hb-big b{font-size:clamp(34px,11vw,44px)}
  /* Hover is not a gesture a phone has, and a hidden absolute tooltip still counts
     toward the scrollable width, which pushed the page a few pixels wide. The names
     stay reachable: every segment keeps its aria-label, and the full league table is
     immediately below. */
  .share-band .seg .tip{display:none}
}
.hb-metric{display:flex;flex-direction:column;justify-content:center;min-width:0}
.hb-label{margin:0;font-size:11.5px;color:var(--text-dim);letter-spacing:.01em}
.hb-big{display:flex;align-items:baseline;gap:12px;margin:8px 0 0;flex-wrap:wrap}
.hb-big b{font-family:var(--font-neutral);font-size:clamp(38px,5.4vw,54px);font-weight:600;
  letter-spacing:-.03em;line-height:1;color:var(--text)}
.hb-chip{font-family:var(--font-mono);font-size:12px;color:var(--mint);padding:4px 11px;
  border-radius:99px;background:rgba(0,196,140,.14);border:1px solid rgba(0,196,140,.42)}
.hb-sub{margin:12px 0 0;font-size:12.5px;color:var(--text-dim);line-height:1.6;max-width:44ch}
.hb-pills{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.hb-pills span{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
  padding:5px 11px;border-radius:99px;border:1px solid var(--edge);background:rgba(0,0,0,.18)}
.hb-pills span b{color:var(--text-dim);font-weight:600}

.hb-visual{display:flex;flex-direction:column;justify-content:center;min-width:0}
/* Values sit above their segment, the way a figure legend sits above a column. The row
   is two lines deep: the threshold pill takes the upper one so it cannot land on top of
   a percentage, which is exactly what it did when both shared a line. */
.band-top{position:relative;height:46px;margin-bottom:7px}
.band-top span{position:absolute;bottom:0;transform:translateX(-50%);font-family:var(--font-mono);
  font-size:11px;color:var(--text);white-space:nowrap}
.band-top .mk{bottom:auto;top:0;font-size:10px;color:var(--risk-mid);padding:3px 9px;
  border-radius:99px;border:1px solid rgba(233,162,59,.45);background:rgba(11,32,25,.92)}
/* No overflow clip: each segment carries its own radius, and clipping here cut the head
   off the threshold marker, which sits above the band by design. */
.share-band{position:relative;display:flex;gap:2px;height:56px;border-radius:9px;
  background:rgba(0,0,0,.24);border:1px solid var(--edge);padding:3px}
/* Only the top four are labelled on the band, so the tail needs a way to identify
   itself. A native title tooltip takes about a second to appear and cannot be styled;
   this one is instant and matches the cards. */
.share-band .seg{position:relative;border-radius:6px;min-width:3px;
  transition:filter .16s,transform .16s}
.share-band .seg:hover,.share-band .seg:focus-visible{filter:brightness(1.5);
  transform:translateY(-2px);outline:none;z-index:3}
/* The segment is an <i>, so anything inside it inherits italics. */
.share-band .seg .tip{font-style:normal;position:absolute;left:50%;bottom:calc(100% + 12px);
  transform:translate(-50%,4px);opacity:0;pointer-events:none;visibility:hidden;
  transition:opacity .16s,transform .16s,visibility .16s;
  background:rgba(8,14,11,.97);border:1px solid rgba(0,196,140,.4);border-radius:9px;
  padding:8px 11px;white-space:nowrap;z-index:6;
  box-shadow:0 10px 30px rgba(0,0,0,.55)}
.share-band .seg:hover .tip,.share-band .seg:focus-visible .tip{
  opacity:1;transform:translate(-50%,0);visibility:visible}
.share-band .seg .tip b{display:block;font-size:12px;color:var(--text);font-weight:600}
.share-band .seg .tip span{display:block;font-family:var(--font-mono);font-size:10.5px;
  color:var(--mint);margin-top:3px}
/* The pointer, drawn as a rotated corner of the same panel. */
.share-band .seg .tip::after{content:"";position:absolute;top:100%;left:50%;
  width:8px;height:8px;margin:-5px 0 0 -4px;transform:rotate(45deg);
  background:rgba(8,14,11,.97);border-right:1px solid rgba(0,196,140,.4);
  border-bottom:1px solid rgba(0,196,140,.4)}
/* Near the edges the tooltip would run off the band, so those anchor to a side. The
   tail is a run of slivers, not one: centring a 150px tooltip on any of the last few
   pushed it past the band, and a hidden element still counts toward the page's scroll
   width, so the page could be dragged sideways at narrower widths. */
.share-band .seg:first-child .tip{left:0;transform:translate(0,4px)}
.share-band .seg:first-child:hover .tip,
.share-band .seg:first-child:focus-visible .tip{transform:translate(0,0)}
.share-band .seg:first-child .tip::after{left:22px}
.share-band .seg:nth-last-child(-n+6) .tip{left:auto;right:0;transform:translate(0,4px)}
.share-band .seg:nth-last-child(-n+6):hover .tip,
.share-band .seg:nth-last-child(-n+6):focus-visible .tip{transform:translate(0,0)}
.share-band .seg:nth-last-child(-n+6) .tip::after{left:auto;right:18px}
/* Rank carries the tint: the leaders read solid, the tail fades out. */
.share-band .s1{background:linear-gradient(180deg,rgba(0,196,140,.5),rgba(0,196,140,.3))}
.share-band .s2{background:linear-gradient(180deg,rgba(0,196,140,.38),rgba(0,196,140,.22))}
.share-band .s3{background:linear-gradient(180deg,rgba(0,196,140,.28),rgba(0,196,140,.16))}
.share-band .lbg{background:linear-gradient(180deg,rgba(127,231,196,.72),rgba(0,196,140,.46));
  box-shadow:0 0 0 1px rgba(127,231,196,.55) inset}
.share-band .tail{background:rgba(140,167,159,.16)}
/* The threshold marker, drawn over the band like the reference line it is. */
.band-mark{position:absolute;top:-8px;bottom:-8px;width:0;border-left:1px dashed var(--risk-mid);
  z-index:2;pointer-events:none}
.band-foot{position:relative;height:30px;margin-top:9px}
.band-foot span{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap}
.band-foot .nm{font-size:11px;color:var(--text-dim);display:block}
.band-foot .pc{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);display:block}
.band-ends{display:flex;justify-content:space-between;font-family:var(--font-mono);
  font-size:10px;color:var(--text-faint);margin-top:2px}

/* KPI cards flip to their backs. The front is the number, the back is what it means,
   which keeps the headline uncluttered without hiding the caveat somewhere else. */
/* Explicit steps rather than auto-fit: auto-fit put three across at 900px and left the
   fourth stranded on its own row. Three columns, then one. */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 40px}
@media (max-width:820px){ .kpis{grid-template-columns:1fr} }
.kpi{position:relative;min-height:112px;perspective:1000px;border:0;background:none;padding:0;
  font:inherit;text-align:left;cursor:pointer}
.kpi-inner{display:block;position:relative;width:100%;height:100%;min-height:118px;
  transition:transform .55s cubic-bezier(.4,.05,.2,1);transform-style:preserve-3d;
  /* Same reason as the view marker's: an unpromoted transform transition is a
     main-thread animation, and this one measured stalled at the identity matrix
     for over 600ms (past the whole 550ms transition) before snapping to the
     flipped state around 1.2s. Promoted, the flip runs on the compositor. */
  will-change:transform}
.kpi[aria-pressed="true"] .kpi-inner{transform:rotateY(180deg)}
.kpi-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--edge);border-radius:var(--r);background:var(--glass);
  padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
.kpi-face.back{transform:rotateY(180deg);background:rgba(0,196,140,.08);
  border-color:rgba(0,196,140,.34);justify-content:center}
.kpi:hover .kpi-face{border-color:rgba(0,196,140,.4)}
.kpi .lab0{font-size:11px;color:var(--text-faint);letter-spacing:.02em;margin-bottom:8px}
.kpi b{display:block;font-family:var(--font-neutral);font-size:28px;font-weight:600;
  letter-spacing:-.02em;color:var(--text);line-height:1.1}
.kpi .lab{font-size:11.5px;color:var(--text-dim);margin-top:6px}
/* The flip affordance is a glyph, not a word: it should not compete with the number. */
.kpi .flip{position:absolute;bottom:12px;right:14px;color:var(--text-faint);opacity:.5;
  transition:opacity .16s,color .16s;line-height:0}
.kpi:hover .flip,.kpi:focus-visible .flip{opacity:1;color:var(--mint)}
.kpi .flip svg{width:13px;height:13px}
.kpi-face.back p{margin:0;font-size:12px;line-height:1.55;color:var(--text-dim)}
.kpi-face.back p b{display:inline;font-size:inherit;font-family:inherit;color:var(--mint)}

/* ==========================================================================
   Market Analytics cards.

   One anatomy, three sizes. The rule that fixes the old page: a card's height
   comes from its PLOT, never from how much prose it carries, so two cards in a
   row line up whether one has a sentence under it or three. Longer explanation
   lives in a reveal layer, not in the column.

   Everything here is namespaced `ma-`. The generic names this page reached for
   first (.cols, .mark) both collided with the rest of the dashboard.
   ========================================================================== */
.ma-row{display:grid;gap:16px;align-items:stretch;margin:0 0 16px}
.ma-row--2{grid-template-columns:1fr 1fr}
.ma-row--3{grid-template-columns:repeat(3,1fr)}
/* The primary view is two equal halves. Neither chart is the other's companion: the
   league table and the concentration curve are the same finding read two ways, so they
   get the same width and the same room to spread. */
.ma-row--lead{grid-template-columns:1fr 1fr;gap:22px}
.ma-row:last-child{margin-bottom:0}

/* Surface, radius, light and hover all come from THE CARD block at the end of
   this stylesheet, which every card on the dashboard now shares. What is left
   here is only what makes this one a chart card: the column layout that lets a
   plot take the slack, and the clip that keeps the reveal panel inside the
   rounded corners. */
.ma-card{display:flex;flex-direction:column;overflow:hidden;padding:17px 20px 15px}

.ma-head{display:flex;align-items:center;gap:11px;padding-bottom:13px;margin-bottom:14px;
  border-bottom:1px solid var(--edge)}
.ma-ico{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:rgba(0,196,140,.1);color:var(--jade)}
.ma-ico svg{width:17px;height:17px}
.ma-htext{flex:1;min-width:0}
.ma-t{margin:0;font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.005em}
.ma-m{margin:2px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ma-info{flex:none;width:23px;height:23px;border-radius:50%;cursor:pointer;
  border:1px solid var(--edge);background:transparent;color:var(--text-faint);
  font:inherit;font-size:11px;font-weight:600;display:grid;place-items:center;
  transition:color .18s,border-color .18s,background .18s}
.ma-info:hover,.ma-card[data-note] .ma-info{color:var(--mint);border-color:rgba(0,196,140,.5);
  background:rgba(0,196,140,.1)}

/* The divided metric strip: the number the chart is about, stated before it. */
.ma-metrics{display:flex;margin-bottom:15px}
.ma-metrics > div{flex:1;min-width:0;padding:0 15px;border-left:1px solid var(--edge)}
.ma-metrics > div:first-child{padding-left:0;border-left:0}
.ma-k{margin:0;font-size:10.5px;color:var(--text-faint)}
.ma-v{margin:4px 0 0;font-family:var(--font-neutral);font-size:20px;font-weight:600;
  letter-spacing:-.02em;color:var(--text);line-height:1.1}
.ma-v.accent{color:var(--mint)}
/* A qualifier for a number whose scale is not obvious ("0 to 1"), set beside it
   rather than under it so the metric still reads as one line. */
.ma-vs{margin-left:7px;font-family:var(--font-mono);font-size:10px;font-weight:400;
  letter-spacing:0;color:var(--text-faint)}
.ma-d{margin:3px 0 0;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint)}

/* Three deliberate plot heights. Charts fill them; they do not set them. */
.ma-plot{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ma-card--compact  .ma-plot{min-height:150px}
.ma-card--standard .ma-plot{min-height:206px}
.ma-card--wide     .ma-plot{min-height:248px}
/* The primary view's own size: the two charts that open the page carry the argument,
   so they get more height than anything below them. */
.ma-card--lead     .ma-plot{min-height:268px}
/* A chart marked to fill spreads through the height it is given rather than
   sitting at the top of it and leaving a hole underneath. */
.ma-plot .hbars.ma-fill{height:100%;justify-content:space-evenly;gap:0}
.ma-card--compact  .ma-plot .mcols{height:126px}
.ma-card--standard .ma-plot .mcols{height:172px}
.ma-card--wide     .ma-plot .mcols{height:196px}
.ma-card .ma-plot .crv{flex:1;min-height:150px}
/* A top-N list fills its card the same way: the visible rows take the slack and the
   reveal button sits on the floor, rather than the whole group floating in the middle.
   Expanding grows the row, and the grid's stretch carries the sibling card with it. */
.ma-topn{display:flex;flex-direction:column;height:100%;width:100%}
.ma-topn > .hbars:first-child{flex:1;justify-content:space-evenly;gap:0}
.ma-topn > .seemore{align-self:flex-start}

/* The takeaway. A bordered aside with its own mark rather than a hairline and a
   sentence: it is the card's conclusion, not a caption, and it should read as a
   separate object from the chart it follows. Clamped to two lines so a long
   conclusion can never make one card taller than the card beside it. */
.ma-take{display:flex;align-items:flex-start;gap:11px;margin:15px 0 0;padding:11px 13px;
  border:1px solid var(--edge);border-radius:var(--card-r-in);background:rgba(255,255,255,.022)}
.ma-take .ti{flex:none;width:26px;height:26px;border-radius:8px;display:grid;
  place-items:center;background:rgba(0,196,140,.1);color:var(--jade)}
.ma-take .ti svg{width:14px;height:14px}
.ma-take p{margin:0;font-size:11.5px;color:var(--text-dim);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  /* Two lines reserved whether or not the sentence needs them. The clamp already
     caps the box at two; without a floor, a one-line takeaway sat 8px higher than
     the two-line one beside it and the row of cards read as misaligned. 3em is
     exactly two lines at 11.5px on a 1.5 line-height. */
  min-height:3em}
.ma-take p b{color:var(--mint);font-weight:600}

/* The reveal. Hover the info button on a pointer device, tap it on a touch one;
   either way the text is one gesture away and never permanently hidden. */
.ma-reveal{position:absolute;left:0;right:0;bottom:0;top:62px;z-index:5;
  padding:16px 20px 18px;overflow:auto;background:rgba(6,11,9,.975);
  border-top:1px solid rgba(0,196,140,.24);
  opacity:0;visibility:hidden;transform:translateY(6px);
  transition:opacity .2s ease,transform .2s ease,visibility .2s ease}
/* Both block kinds carry a reveal: the card and the bare chart in the primary view.
   The card-only selector left the bare blocks' explanations unreachable.

   Hover opens it; the pinned state is what a tap or a keypress sets. `:focus-visible`
   is deliberately NOT a trigger: a tap leaves focus on the button, so it held the panel
   open and the second tap could never close it. Enter and Space still work, because
   they fire the button's click. */
.ma-card:has(.ma-info:hover) .ma-reveal,
.ma-card[data-note] .ma-reveal{opacity:1;visibility:visible;transform:none}
.ma-reveal .rt{margin:0 0 9px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-faint)}
.ma-reveal p:not(.rt){margin:0 0 9px;font-size:12px;color:var(--text-dim);line-height:1.65}
.ma-reveal p:last-child{margin-bottom:0}
.ma-reveal b{color:var(--mint);font-weight:600}

/* Section head: title, one sentence, nothing more. */
.ma-sec{margin:0 0 44px}
.ma-sec .ma-eye{margin:0 0 7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--text-faint)}
.ma-sec h2{margin:0 0 5px;font-family:var(--font-neutral);font-size:18px;font-weight:600;
  letter-spacing:-.01em}
/* No measure cap: these are single sentences and should stay on one line while the
   window has room for them, rather than wrapping against an arbitrary ch limit. */
.ma-sec .ma-lede{margin:0 0 18px;font-size:13px;color:var(--text-dim);line-height:1.6}

/* ---- The concentration curve ---------------------------------------------
   The axis labels are HTML in a gutter, not <text> inside the SVG. The plot is
   drawn with preserveAspectRatio="none" so it fills whatever box it is given, and
   that stretch would distort any type inside it. Out here the labels stay upright
   at every width, and the gutter is what the SVG's left edge lines up against. */
.crv{position:relative;display:flex;flex-direction:column;min-width:0;
  padding:0 0 20px 38px}
.crv .curve{flex:1;width:100%;min-height:0;overflow:visible;margin:0}
.crv .cy{position:absolute;left:0;transform:translateY(-50%);
  font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint)}
.crv .ctop{position:absolute;top:1px;font-family:var(--font-mono);font-size:9.5px;
  color:var(--risk-mid);white-space:nowrap}
.crv .cx{position:absolute;left:38px;right:0;bottom:0;display:flex;
  justify-content:space-between;font-family:var(--font-mono);font-size:9.5px;
  color:var(--text-faint)}

/* ---- Vertical columns ----------------------------------------------------
   Sneha plots size bands, the contested book, clients under pressure and sector
   borrowing as vertical bars. They are ordered or grouped comparisons, and reading
   them along the bottom is the point, so they stay vertical here rather than being
   flattened into the horizontal house style.

   Three sibling rows keep the columns aligned: values, bars, labels. Only the bar
   row carries a height, because a percentage needs a definite one to resolve. */
.ma-vwrap{display:flex;flex-direction:column;min-width:0}
/* Three column-pairs strung across a full-width card leaves most of it empty. Capping
   the plot and centring it turns that into margin, which reads as deliberate. */
.ma-vwrap.is-narrow{max-width:760px;margin:0 auto;width:100%}
.ma-vvals,.ma-vbars,.ma-vlabs{display:flex;gap:12px;align-items:flex-end}
.ma-vvals > *,.ma-vbars > *,.ma-vlabs > *{flex:1;min-width:0;text-align:center}
.ma-vvals{margin-bottom:7px}
.ma-vvals span{font-family:var(--font-mono);font-size:11px;color:var(--text)}
.ma-vvals span.hi{color:var(--mint)}
.ma-card--compact  .ma-vbars{height:120px}
.ma-card--standard .ma-vbars{height:168px}
.ma-card--wide     .ma-vbars{height:196px}
/* Capped and centred: at full slot width a four-column chart reads as four blocks
   rather than as bars. The floor keeps a near-zero category visible as a mark, and the
   true figure is printed directly above every column, so nothing rests on bar length. */
.ma-vbars i{display:block;width:100%;max-width:74px;margin:0 auto;border-radius:5px 5px 0 0;
  min-height:3px;background:linear-gradient(180deg,rgba(0,196,140,.42),rgba(0,196,140,.16));
  border-top:1px solid var(--jade);transition:filter .16s}
.ma-vbars > span{position:relative;height:100%;display:flex;align-items:flex-end}
.ma-vbars > span:hover i{filter:brightness(1.45)}
.ma-vbars.is-risk i{background:linear-gradient(180deg,rgba(224,87,76,.4),rgba(224,87,76,.14));
  border-top-color:var(--risk-high)}
.ma-vlabs{margin-top:9px;align-items:flex-start}
.ma-vlabs span{font-size:11px;color:var(--text-dim);line-height:1.35;
  white-space:pre-line}

/* Grouped columns: two series per category, side by side inside one slot. */
.ma-vbars .grp{display:flex;gap:6px;align-items:flex-end;width:100%;max-width:112px;
  margin:0 auto;height:100%}
.ma-vbars .grp i{width:50%;max-width:none;margin:0}
.ma-vbars .grp i.b{background:linear-gradient(180deg,rgba(140,167,159,.34),rgba(140,167,159,.1));
  border-top-color:var(--text-faint)}

/* Hover tag on a histogram bar, so a bin can say which bin it is. */
.mcol{position:relative}
.mcol .btip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);
  opacity:0;visibility:hidden;pointer-events:none;z-index:6;white-space:nowrap;
  padding:6px 10px;border-radius:8px;background:rgba(8,14,11,.97);
  border:1px solid rgba(0,196,140,.4);box-shadow:0 8px 24px rgba(0,0,0,.5);
  transition:opacity .14s,transform .14s,visibility .14s}
.mcol:hover .btip{opacity:1;visibility:visible;transform:translate(-50%,0)}
.mcol:hover i{background:rgba(127,231,196,.6)}
.mcol .btip b{display:block;font-size:11.5px;color:var(--text);font-weight:600}
.mcol .btip span{display:block;font-family:var(--font-mono);font-size:10px;color:var(--mint);
  margin-top:2px}
/* The end bins would push their tag off the chart, so those anchor to a side. */
.mcols > .mcol:nth-child(-n+4) .btip{left:0;transform:translate(0,4px)}
.mcols > .mcol:nth-child(-n+4):hover .btip{transform:translate(0,0)}
.mcols > .mcol:nth-last-child(-n+4) .btip{left:auto;right:0;transform:translate(0,4px)}
.mcols > .mcol:nth-last-child(-n+4):hover .btip{transform:translate(0,0)}

/* Dropping a three-up to two columns strands the third card at its own height beside
   nothing. Letting it span both keeps the wrap looking chosen rather than left over. */
@media (max-width:1000px){
  .ma-row--3{grid-template-columns:repeat(2,1fr)}
  .ma-row--3 > .ma-card:nth-child(3){grid-column:1 / -1}
}
@media (max-width:880px){
  .ma-row--2,.ma-row--lead{grid-template-columns:1fr}
  .ma-reveal{top:56px}
}
@media (max-width:660px){ .ma-row--3{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .ma-card,.ma-card::before,.ma-reveal{transition:none} }

/* Section rhythm: an eyebrow, a claim, then the evidence. More air between sections
   than inside them, so the page reads as chapters rather than a run of panels. */
/* One header pattern for every card: title left, meta right, hairline, content. */
/* The title never gets squeezed by its own metadata: it keeps the row and the meta
   drops beneath when there is not room for both. */
.chead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:10px;
  margin-bottom:14px;border-bottom:1px solid var(--edge)}
.chart-t{font-size:12.5px;color:var(--text);margin:0;font-weight:600;letter-spacing:-.005em;
  flex:1 1 auto;min-width:0}
.chart-s{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);margin:0 0 0 auto;
  text-align:right;flex:0 1 auto;line-height:1.5}
@media (max-width:520px){ .chart-s{margin-left:0;text-align:left} }

/* Legend chips, used where two series share an axis. */
.ma-legend{display:flex;gap:16px;margin:14px 0 0;flex-wrap:wrap}
.ma-legend span{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-dim)}
.ma-legend i{width:9px;height:9px;border-radius:3px;flex:none}
.ma-legend .n{background:rgba(140,167,159,.4);border:1px solid var(--text-faint)}
.ma-legend .g{background:rgba(0,196,140,.4);border:1px solid var(--jade)}

/* Horizontal bars: an outlined track with a tinted fill, so the full width always
   reads as the scale and the bar reads as the share of it. */
.hbars{display:flex;flex-direction:column;gap:7px}
/* The value column is sized for the longest string it will hold ("18,235 · 21.1%") and
   never wraps: a wrapped value grows the row and collides with its own bar. */
/* The value now rides inside the track instead of taking a column of its own, which
   gives the bar the width that column used to hold. A long bar carries its number
   inside the fill; a short one sets it just past the end, where it is still readable. */
/* 176px is set by the longest label any unranked bar chart carries,
   "Technology, legal & professional" at 172px. Below that it ellipsised. */
.hbar{--lab:176px;display:grid;grid-template-columns:var(--lab) 1fr;align-items:center;
  gap:11px;font-size:12px}
/* A ranked list earns its numerals: they are what makes "fourth" checkable at a glance. */
.hbars.ranked .hbar{--lab:104px;grid-template-columns:20px var(--lab) 1fr}
.hbar .rk{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);text-align:right}
.hbar.hb-lbg .rk{color:var(--mint)}

/* The remainder of a top-N list. Same grid-rows animation as the filter drawers, so the
   page has one way of opening things rather than two. */
.morewrap{display:grid;grid-template-rows:0fr;opacity:0;
  transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1),opacity .22s ease}
.morewrap[data-open]{grid-template-rows:1fr;opacity:1;margin-top:7px}
.morewrap > .clip{overflow:hidden;min-height:0}
.seemore{font:inherit;font-size:11.5px;margin-top:12px;padding:8px 14px;border-radius:99px;
  cursor:pointer;background:transparent;border:1px solid var(--edge);color:var(--text-dim);
  display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden;
  transition:border-color .2s,color .2s}
.seemore:hover{border-color:rgba(0,196,140,.5);color:var(--text)}
/* A light sweep on hover: the whole affordance is one small button, so the motion is
   what tells you it is interactive. */
.seemore::before{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(0,196,140,.16),transparent);
  transition:transform .55s ease}
.seemore:hover::before{transform:translateX(100%)}
.seemore .chev{font-size:14px;line-height:1;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.seemore[aria-expanded="true"] .chev{transform:rotate(90deg)}
.hbar .k{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{position:relative;height:22px;border:1px solid var(--edge);border-radius:5px;
  background:rgba(0,0,0,.18)}
.hbar .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;
  background:linear-gradient(90deg,rgba(0,196,140,.16),rgba(0,196,140,.34));
  border-right:1px solid var(--jade);transition:width .5s cubic-bezier(.4,0,.2,1)}
/* Ten pixels past the fill, unless that would run the number out of the track: then it
   stops at whatever the chart reserved for its longest value and rides on the fill
   instead. One expression covers both cases at every width. */
.hbar .v{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--font-mono);
  font-size:11px;color:var(--text);white-space:nowrap;pointer-events:none;
  left:max(0px, min(calc(var(--fw) + 10px), calc(100% - var(--vmax, 106px))))}
/* A track this short cannot hold a bar and a number side by side at all, so below it
   the value simply pins to the end of the track. */
@media (max-width:520px){ .hbar .v{left:auto;right:8px;color:var(--text-dim)} }
.hbar.hb-lbg .fill{background:linear-gradient(90deg,rgba(0,196,140,.3),rgba(127,231,196,.5));
  border-right-color:var(--mint)}
.hbar.hb-lbg .k,.hbar.hb-lbg .v{color:var(--mint)}
/* Lloyds is the row the reader came for, so its track is outlined as well as filled. */
.hbar.hb-lbg .track{border-color:rgba(0,196,140,.45)}

/* A ranked list reads as rows, not as a stack of bars: a rule in the label gutter
   separates one lender from the next without drawing a line across the chart. */
.ma-topn .hbar{position:relative;padding-bottom:10px}
/* The rule stops where the track starts: rank column, gap, then the label column. */
.ma-topn .hbar::after{content:"";position:absolute;left:0;bottom:0;height:1px;
  width:calc(31px + var(--lab, 104px));background:var(--edge)}
.ma-topn > .hbars:first-child > .hbar:last-child::after{display:none}
/* The two charts that open the page get a heavier bar: at this width a 22px track
   reads as a rule, and the number sitting in it needs the room. The label column
   widens with them, so a spelled-out lender name is not clipped. */
.ma-card--lead .hbars.ranked .hbar{--lab:132px}
.ma-card--lead .hbar .track{height:30px;border-radius:7px}
.ma-card--lead .hbar .fill{border-radius:6px}
.hbar.hb-rival .fill{background:linear-gradient(90deg,rgba(233,162,59,.14),rgba(233,162,59,.3));
  border-right-color:var(--risk-mid)}
.hbar:hover .track{border-color:var(--edge-bright)}

/* Columns, used for the two histograms and the contested-book bars. */
/* Two faint gridlines give the columns something to be read against without drawing
   a full axis, which at this size would cost more than it explains. */
.mcols{position:relative;display:flex;align-items:flex-end;gap:2px;height:132px;padding-top:6px;
  background-image:linear-gradient(var(--edge),var(--edge)),linear-gradient(var(--edge),var(--edge));
  background-size:100% 1px,100% 1px;background-position:0 33%,0 66%;background-repeat:no-repeat}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.mcol i{display:block;border-radius:3px 3px 0 0;background:rgba(0,196,140,.28);
  border-top:1px solid var(--jade);min-height:1px;transition:background .16s}
.mcol:hover i{background:rgba(127,231,196,.5)}
.colaxis{display:flex;justify-content:space-between;font-family:var(--font-mono);
  font-size:10px;color:var(--text-faint);margin-top:7px}
.colnote{margin:12px 0 0;font-size:11.5px;color:var(--text-faint);line-height:1.5}

/* Labelled columns for small categorical sets. */
.lcols{display:grid;gap:10px}
.lcol{display:grid;grid-template-columns:1fr 58px;align-items:center;gap:10px;font-size:12px}
.lcol .track{position:relative;height:24px;border:1px solid var(--edge);border-radius:5px;
  background:rgba(0,0,0,.18);overflow:hidden}
.lcol .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,
  rgba(224,87,76,.16),rgba(224,87,76,.34));border-right:1px solid var(--risk-high)}
.lcol .cap{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11.5px;
  color:var(--text)}
.lcol .v{font-family:var(--font-mono);font-size:11px;text-align:right;color:var(--text)}

/* Heatmap: a share grid, tinted by value, with the number always readable on top. */
.heat{display:grid;gap:3px;font-size:11px}
.heat .hh{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);
  text-align:center;padding-bottom:3px;line-height:1.3}
.heat .rh{color:var(--text-dim);font-size:11.5px;display:flex;align-items:center;
  padding-right:8px;white-space:nowrap}
.heat .cell{position:relative;height:34px;border:1px solid var(--edge);border-radius:5px;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);
  font-size:11.5px;color:var(--text);transition:border-color .16s}
.heat .cell:hover{border-color:var(--mint)}
/* Below this the cells stop being readable, so the grid scrolls rather than crushes. */
.heatwrap{overflow-x:auto}
@media (max-width:760px){ .heatwrap .heat{min-width:600px} }
.heatscale{display:flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--font-mono);
  font-size:10px;color:var(--text-faint)}
.heatscale i{display:block;width:74px;height:9px;border-radius:3px;border:1px solid var(--edge);
  background:linear-gradient(90deg,rgba(0,196,140,.05),rgba(0,196,140,.47))}

/* Two series side by side, for sector borrowing against our share of it. */

/* The concentration curve. One SVG, because a line with points is the honest shape
   for a cumulative total and bars would imply categories. */
/* The plot stretches to fill its box, so every stroke is pinned to screen pixels
   with vector-effect rather than being scaled with the coordinate system. */
.curve{width:100%;height:232px;overflow:visible;margin:4px 0 6px}
.curve .grid,.curve .ref,.curve .ln,.curve .pt{vector-effect:non-scaling-stroke}
.curve .grid{stroke:var(--edge);stroke-width:1}
.curve .ref{stroke:var(--risk-mid);stroke-width:1;stroke-dasharray:4 4;opacity:.75}
.curve .ln{fill:none;stroke:var(--jade);stroke-width:2;stroke-linejoin:round}
.curve .ar{fill:url(#crvfill)}
.curve .pt{fill:var(--green-deeper);stroke:var(--mint);stroke-width:1.5}

/* ---- Interaction polish --------------------------------------------------
   Restrained on purpose: one lift, one rim, one sweep. The page is a report, so
   motion is there to say "this responds", not to decorate. */
.hero-band{transition:border-color .22s ease,box-shadow .22s ease}
.kpi .kpi-face{transition:border-color .22s ease,box-shadow .22s ease}
.kpi:hover .kpi-face{box-shadow:0 14px 40px rgba(0,0,0,.34)}
/* A slow sheen across the KPI face on hover, which is what marks it as turnable. */
.kpi .kpi-face:not(.back){position:absolute;overflow:hidden}
.kpi .kpi-face:not(.back)::after{content:"";position:absolute;inset:0;
  transform:translateX(-120%);pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(127,231,196,.09) 50%,transparent 65%);
  transition:transform .75s cubic-bezier(.3,.7,.3,1)}
.kpi:hover .kpi-face:not(.back)::after{transform:translateX(120%)}
/* One focus treatment for everything the keyboard can reach on this page. */
.ma-sec button:focus-visible,.kpi:focus-visible,.share-band .seg:focus-visible,
.topnav button:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:10px}

.mkt-caveat{border:1px dashed var(--edge);border-radius:var(--r);padding:16px 18px;
  background:rgba(0,0,0,.14)}
.mkt-caveat p{margin:0;font-size:12px;color:var(--text-dim);line-height:1.65}
.mkt-caveat .eyebrow{margin-bottom:8px}

@media (prefers-reduced-motion: reduce){
  .kpi-inner,.hbar .fill{transition:none}
}

/* The result line. Deliberately plain: it is the answer, not another control. */
.resultbar{display:flex;align-items:baseline;gap:14px;margin:26px 0 4px;flex-wrap:wrap}
.fcount{font-family:var(--font-neutral);font-size:17px;font-weight:600;color:var(--text);
  letter-spacing:-.01em}
.fcount b{font-family:var(--font-mono);font-size:16px;color:var(--mint);font-weight:600}
.fclear{font:inherit;font-size:12px;padding:5px 12px;border-radius:99px;cursor:pointer;
  background:transparent;border:1px solid var(--edge);color:var(--text-dim);margin-left:auto}
.fclear:hover{border-color:var(--risk-high);color:var(--text)}
.fclear[hidden]{display:none}

@media (prefers-reduced-motion: reduce){
  .drawer,.toolbtn .chev,.vseg .thumb{transition:none}
}

/* Both columns are flex stacks with a gap, so nothing depends on margin
   collapsing and no panel can ride up into the one above it. */
.cols{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-top:16px;align-items:start}
.colstack{display:flex;flex-direction:column;gap:16px;min-width:0}

.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--text-dim)}
.kv b{font-weight:600;text-align:right}
.kv .mono{font-family:var(--font-mono);font-size:12px;font-weight:500}

.stagehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.stagehead b{font-family:var(--font-neutral);font-size:16px;font-weight:600;letter-spacing:-.015em}
.stagehead span{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.flagchip{font-size:11.5px;padding:4px 10px;border-radius:99px;
  background:rgba(224,87,76,.12);border:1px solid rgba(224,87,76,.38);color:#F09A92}
.pending{opacity:.55}
.pending .kv b{color:var(--text-faint);font-weight:400;font-style:italic}
/* Every card closes the same way: a bordered aside, not a hairline and a run of
   grey text. The analytics cards put a conclusion there and give it a mark
   (`.ma-take`); a panel closes with provenance instead, so it takes the same box
   one shade quieter and without one. Same shape, and the difference that remains
   is the one that is real. */
.disclaimer{margin:15px 0 0;padding:11px 13px;border:1px solid var(--edge);
  border-radius:var(--card-r-in);background:rgba(255,255,255,.018);
  font-size:11.5px;color:var(--text-faint);line-height:1.5}

.spine{position:relative;padding-left:26px}
.spine::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;
  background:linear-gradient(180deg,transparent,var(--edge-bright) 12%,var(--edge-bright) 88%,transparent)}
.ev{position:relative;display:grid;grid-template-columns:96px 96px 1fr;gap:14px;
  align-items:baseline;padding:9px 0}
.ev::before{content:"";position:absolute;left:-25px;top:15px;width:11px;height:11px;
  border-radius:99px;background:var(--src);border:2px solid #063826;
  box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.ev-date{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)}
.ev-src{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--src);font-weight:600}
.ev-detail{font-size:13.5px}
.ev-detail a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.18)}
.ev-detail a:hover,.ev-detail a:focus-visible{color:var(--mint);border-color:var(--mint);outline:none}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.tile{padding:15px 16px;border-radius:12px}
.tile.on{border-color:rgba(0,196,140,.45);background:rgba(0,196,140,.10)}
.tile.wait{border-style:dashed;opacity:.6}
/* The tile's header is the panel header one size down again, and without the rule:
   at 172px wide a divider would cost more room than it earns. */
.tile-head{display:flex;align-items:center;gap:9px;min-width:0}
.tile-head .ma-ico{flex:none;width:24px;height:24px;border-radius:7px}
.tile-head .ma-ico svg{width:13px;height:13px}
.tile-name{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-faint);
  font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* A source that is off or still pending should not have its icon shouting in green. */
.tile.off .ma-ico,.tile.wait .ma-ico{background:rgba(255,255,255,.05);color:var(--text-faint)}
.tile-val{font-family:var(--font-neutral);font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:10px}
.tile.off .tile-val,.tile.wait .tile-val{font-size:13px;font-weight:400;color:var(--text-faint);
  font-family:var(--font-ui);letter-spacing:0}
.tile-sub{font-size:11.5px;color:var(--text-dim);margin-top:3px}
/* A tile that opens a detail panel. Rendered as a real button so it is reachable
   by keyboard and announces its expanded state, not a div with a click handler. */
button.tile{font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer;
  display:block;background:var(--glass)}
.tile.tappable:hover,.tile.tappable:focus-visible{border-color:rgba(143,184,255,.55);outline:none}
.tile.tappable .tile-sub::after{content:" \203A";color:var(--text-faint)}
.tiledetail{margin-top:12px}
.ev-link.rejected{opacity:.78}
.ev-link.rejected:hover,.ev-link.rejected:focus-visible{border-color:rgba(224,87,76,.5);
  background:rgba(224,87,76,.10)}

.ev-links{display:flex;flex-wrap:wrap;gap:8px}
.ev-link{display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;
  background:var(--glass);border:1px solid var(--edge);color:var(--text);
  text-decoration:none;font-size:12.5px;transition:border-color .18s,background .18s}
.ev-link:hover,.ev-link:focus-visible{border-color:var(--jade);background:rgba(0,196,140,.14);outline:none}
.ev-link .k{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint)}
.conf-chip{font-family:var(--font-mono);font-size:10.5px;padding:2px 7px;border-radius:99px;
  background:rgba(255,255,255,.07);color:var(--text-dim);border:1px solid var(--edge)}

.nothing{position:relative;overflow:hidden;padding:38px 32px}
.nothing-horse{position:absolute;right:18px;bottom:-30px;width:200px;height:auto;opacity:.16;pointer-events:none}
.nothing h2{font-family:var(--font-neutral);font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0 0 10px}
.nothing p{color:var(--text-dim);max-width:54ch;margin:0 0 22px}
.checked{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 26px;max-width:660px}
.checked div{display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.checked span{margin-left:auto;font-size:11.5px;color:var(--text-faint)}
.tick{width:14px;height:14px;color:var(--text-faint);flex:none}

.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--edge);
  font-size:11.5px;color:var(--text-faint);display:flex;gap:16px;flex-wrap:wrap}

.rise{animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .wl-row:hover{transform:none}
}
@media (max-width:880px){
  .cols{grid-template-columns:1fr}
  .wl-row{grid-template-columns:1fr 140px}
  .wl-why{display:none}
  .ev{grid-template-columns:88px 1fr;gap:4px 12px}
  .ev-src,.ev-detail{grid-column:2}
}

/* ==========================================================================
   LIQUID GLASS
   --------------------------------------------------------------------------
   One material, three thicknesses. Four layers make it read as glass rather
   than as a blurred rectangle:

     1  refraction   the backdrop is displaced through an SVG lens map, so
                     content behind the pane bends outward at the edges
     2  specular     a fixed light off the top-left catches the surface
     3  bevel        inset rim, lit top-left, falling away bottom-right
     4  depth        outer shadow that scales with the size of the pane

   Refraction is applied through `backdrop-filter: url(...)`, which is the
   only way to bend what is BEHIND an element. Putting the SVG filter on the
   element itself (`filter: url(...)`) would displace its own text instead,
   which is what makes most web "liquid glass" attempts look smeared.
   Chromium is the only engine that resolves an SVG filter in backdrop-filter
   today, so the JS probe near the top of the script sets `data-lg-refract`
   on <html> only when it genuinely works. Everywhere else the other three
   layers carry the effect on their own, and still read as glass.

   The utility is `.lg` plus `.lg--sm|md|lg`. Existing components are aliased
   onto it below rather than having the class added in twenty template
